<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트 시안</title>
<link rel="stylesheet" href="design.css">
<style>
  header {
    padding: 32px 24px 8px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0;
    color: var(--page-muted);
    font-size: 0.875rem;
  }
  main {
    padding: 24px 24px 64px;
  }
  .sizes {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--page-gap);
  }
  .widget {
    background: var(--dot-frame);
  }
  .caption {
    color: var(--dot-caption);
  }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="spec"></p>
</header>
<main>
  <div class="sizes" id="sizes"></div>
</main>

<script>
// 세 비교안(-a, -b, -c)은 이 STYLE 한 줄만 다르다.
// dot: 한 칸 크기(pt). outline: 물체 외곽선. dither: 색 띠 경계를 섞는 폭(0 이면 딱 끊김, 1 이면 띠 전체를 섞음). grain: 거친 질감. glow: 불빛 번짐 반지름(칸).
const STYLE = { key: 'C', name: '섬세형', dot: 2, outline: false, dither: 1, grain: true, glow: 1.8 };

// 01-window.html 의 '크리스마스 이브 밤'. moon: [위상, 고도, 방위각]
const SCENE = { region: '서울', time: '오후 9:00', temperature: -5, moon: [0.52, 39, 84], cloudCover: 0.1, occasion: '크리스마스 이브' };

const SIZES = { small: [170, 170], medium: [364, 170], large: [364, 382] };

const rootStyle = getComputedStyle(document.documentElement);
function color(name) {
  const value = rootStyle.getPropertyValue('--dot-' + name).trim();
  if (!/^#[0-9a-f]{6}$/i.test(value)) throw new Error(`design.css 에 --dot-${name} (#RRGGBB) 이 없다`);
  return value;
}

// 시드 고정 난수 (Swift SeededRandom 과 같은 수열)
const MASK64 = (1n << 64n) - 1n;
class Rand {
  constructor(seed) { this.state = BigInt(seed); }
  next() {
    this.state = (this.state + 0x9E3779B97F4A7C15n) & MASK64;
    let z = this.state;
    z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & MASK64;
    z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & MASK64;
    return z ^ (z >> 31n);
  }
  below(bound) {
    let m = this.next() * bound;
    if ((m & MASK64) < bound) {
      const t = ((1n << 64n) - bound) % bound;
      while ((m & MASK64) < t) m = this.next() * bound;
    }
    return m >> 64n;
  }
  range(lower, upper) {
    const max = 1n << 53n;
    const r = this.below(max + 1n);
    if (r === max) return upper;
    return (upper - lower) * (Number(r) * (Number.EPSILON / 2)) + lower;
  }
}

// ---- 도트 격자 ----

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bayer = (x, y) => (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + 0.5) / 16;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// f(0~1) 만큼 a 에서 b 로 넘어가는 자리의 색. STYLE.dither 가 섞는 폭을 정한다.
function blend(a, b, f, x, y) {
  const t = STYLE.dither === 0 ? (f >= 0.5 ? 1 : 0) : clamp((f - 0.5) / STYLE.dither + 0.5, 0, 1);
  return t > bayer(x, y) ? b : a;
}

class Grid {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.cells = new Array(cols * rows).fill(null);
    this.ox = 0;
    this.oy = 0;
    this.bounds = [0, 0, cols, rows];
  }
  set(x, y, c) {
    const ax = Math.floor(x) + this.ox, ay = Math.floor(y) + this.oy;
    const [x0, y0, x1, y1] = this.bounds;
    if (ax < x0 || ay < y0 || ax >= x1 || ay >= y1) return;
    this.cells[ay * this.cols + ax] = c;
  }
  // (x, y) 를 원점으로 옮기고 w×h 안에만 그린다.
  within(x, y, w, h, draw) {
    const saved = [this.ox, this.oy, this.bounds];
    const [x0, y0, x1, y1] = this.bounds;
    this.ox += x;
    this.oy += y;
    this.bounds = [Math.max(x0, this.ox), Math.max(y0, this.oy), Math.min(x1, this.ox + w), Math.min(y1, this.oy + h)];
    draw();
    [this.ox, this.oy, this.bounds] = saved;
  }
  rect(x, y, w, h, c) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.set(i, j, c);
  }
  // 칸 가운데가 inside 를 만족하는 칸을 칠한다. c 는 색 또는 (x, y) => 색.
  shape(x0, y0, x1, y1, inside, c) {
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
        if (!inside(x + 0.5, y + 0.5)) continue;
        const value = typeof c === 'function' ? c(x, y) : c;
        if (value) this.set(x, y, value);
      }
    }
  }
  // 계단 사선 (Bresenham)
  line(x0, y0, x1, y1, c) {
    [x0, y0, x1, y1] = [x0, y0, x1, y1].map(Math.round);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    for (;;) {
      this.set(x0, y0, c);
      if (x0 === x1 && y0 === y1) return;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }
  canvas() {
    const canvas = document.createElement('canvas');
    canvas.width = this.cols;
    canvas.height = this.rows;
    const ctx = canvas.getContext('2d');
    this.cells.forEach((c, i) => {
      if (!c) return;
      ctx.fillStyle = c;
      ctx.fillRect(i % this.cols, Math.floor(i / this.cols), 1, 1);
    });
    return canvas;
  }
}

// ---- 창 구조: 창틀·창살·창턱은 위젯 크기에 비례하고, 칸 수로 반올림한다 ----

function windowGeometry(w, h) {
  const D = STYLE.dot;
  const cols = Math.ceil(w / D), rows = Math.ceil(h / D);
  const framePt = Math.min(w, h) * 0.055;
  const F = Math.max(1, Math.round(framePt / D));
  const M = Math.max(1, Math.round(framePt * 0.5 / D));
  const S = Math.max(3, Math.round(framePt * 2.7 / D));
  const sillTop = Math.max(1, Math.round(S * 0.24));
  return {
    cols, rows, F, M, S, sillTop,
    // 칸 크기로 나누어떨어지지 않는 나머지는 양쪽 창틀 가장자리에서 잘린다.
    offset: [Math.floor((cols * D - w) / 2), Math.floor((rows * D - h) / 2)],
    glass: { x: F, y: F, w: cols - F * 2, h: rows - S - F },
  };
}

// 창은 남쪽을 바라본다. 유리 기준 단위 좌표.
function celestialPoint(altitude, azimuth) {
  if (altitude <= -2) return null;
  const d = ((azimuth % 360) + 360) % 360 - 180;
  const base = 0.72 - 0.035;
  const x = clamp(0.5 + d / 135 * 0.45, 0.05, 0.95);
  const y = base - Math.pow(clamp(altitude, 0, 75) / 75, 0.75) * (base - 0.1);
  return [x, y];
}

// ---- 창밖 레이어. 좌표는 유리 기준 칸. 물체 크기는 pt 로 정해 칸 크기와 관계없이 같은 크기로 보인다 ----

const pt = v => v / STYLE.dot;

function drawSky(g, gw, gh) {
  const bands = ['sky-1', 'sky-2', 'sky-3', 'sky-4'].map(color);
  const horizon = gh * 0.72;
  for (let y = 0; y < gh; y++) {
    const t = clamp((y + 0.5) / horizon, 0, 1) * (bands.length - 1);
    const i = Math.min(bands.length - 2, Math.floor(t));
    for (let x = 0; x < gw; x++) g.set(x, y, blend(bands[i], bands[i + 1], t - i, x, y));
  }
}

function drawStars(g, gw, gh) {
  const random = new Rand(3);
  // 칸이 클수록 별 하나가 커지므로 수를 줄인다.
  const count = Math.round(gw * gh * STYLE.dot * STYLE.dot * 0.0012 * 3 / STYLE.dot);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(random.range(0, 1) * gw), y = Math.floor(random.range(0, 0.62) * gh);
    const bright = random.range(0, 1) < 0.3;
    g.set(x, y, color(bright ? 'star' : 'star-dim'));
    // 섬세형은 밝은 별에 십자 빛을 단다.
    if (bright && STYLE.grain) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) g.set(x + dx, y + dy, color('star-dim'));
  }
}

function drawMoon(g, gw, gh) {
  const point = celestialPoint(SCENE.moon[1], SCENE.moon[2]);
  if (!point) return;
  const cx = Math.floor(point[0] * gw) + 0.5, cy = Math.floor(point[1] * gh) + 0.5;
  const r = pt(12) + 0.3;
  const haloWidth = STYLE.dither === 0 ? 1 : STYLE.grain ? 3 : 2;
  const dist = (x, y) => Math.hypot(x - cx, y - cy);
  g.shape(cx - r - haloWidth, cy - r - haloWidth, cx + r + haloWidth, cy + r + haloWidth,
    (x, y) => dist(x, y) > r && dist(x, y) <= r + haloWidth,
    (x, y) => {
      if (STYLE.dither === 0) return color('halo');
      const density = 1 - (dist(x + 0.5, y + 0.5) - r) / (haloWidth + 0.5);
      return density * 0.75 > bayer(x, y) ? color('halo') : null;
    });
  // 차는 달(위상 < 0.5)은 오른쪽이 밝다. 경계선은 x 반지름이 cos(2π·위상)인 반타원.
  const phase = SCENE.moon[0];
  const k = Math.cos(phase * 2 * Math.PI);
  const lit = (x, y) => {
    const dx = (x - cx) / r, dy = (y - cy) / r;
    const s = Math.sqrt(Math.max(0, 1 - dy * dy));
    return phase < 0.5 ? dx >= k * s : dx <= -k * s;
  };
  const inDisc = (x, y) => dist(x + 0.5, y + 0.5) <= r;
  // 섬세형은 달 표면의 어두운 바다 두 곳을 성기게 찍는다.
  const maria = [[-0.3, -0.15, 0.3], [0.25, 0.3, 0.2]];
  const onMare = (x, y) => STYLE.grain && maria.some(([dx, dy, mr]) => Math.hypot(x + 0.5 - cx - dx * r, y + 0.5 - cy - dy * r) <= mr * r) && bayer(x, y) < 0.5;
  g.shape(cx - r, cy - r, cx + r, cy + r, (x, y) => dist(x, y) <= r, (x, y) => {
    if (!lit(x + 0.5, y + 0.5)) return color('halo');
    const boundary = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => !inDisc(x + dx, y + dy));
    if (STYLE.outline && boundary) return color('star');
    if (onMare(x, y)) return color('star');
    return color('moon');
  });
}

function drawClouds(g, gw, gh) {
  const random = new Rand(5);
  const count = Math.round(SCENE.cloudCover * 7);
  for (let i = 0; i < count; i++) {
    const x = random.range(-0.05, 1.05) * gw, y = random.range(0.1, 0.42) * gh;
    const s = pt(random.range(14, 20));
    const blobs = [[0, 0.25, 1.2, 0.35], [-0.6, 0.05, 0.42, 0.42], [-0.15, -0.25, 0.58, 0.58], [0.4, -0.1, 0.5, 0.5], [0.8, 0.1, 0.34, 0.34]];
    const inside = (px, py) => blobs.some(([dx, dy, rx, ry]) => ((px - x - s * dx) / (s * rx)) ** 2 + ((py - y - s * dy) / (s * ry)) ** 2 <= 1);
    g.shape(x - s * 1.3, y - s * 0.9, x + s * 1.3, y + s * 0.7, inside, color('cloud'));
  }
}

function drawLandscape(g, gw, gh) {
  const horizon = Math.round(gh * 0.72);
  const ground = x => gh * 0.83 + gh * 0.025 * Math.sin(x / gw * 2 * Math.PI * 0.8 + 2);

  const city = new Rand(11);
  let x = gw * 0.34;
  while (x < gw * 0.68) {
    const bw = Math.max(2, Math.round(pt(city.range(9, 15))));
    const bh = Math.max(2, Math.round(pt(city.range(12, 34))));
    const bx = Math.round(x), top = horizon - bh;
    g.rect(bx, top, bw, bh + Math.round(gh * 0.05), color('city'));
    const step = Math.max(2, Math.round(pt(6)));
    for (let wy = top + 1; wy < horizon - 1; wy += step) {
      for (let wx = bx + 1; wx < bx + bw - 1; wx += step) {
        if (city.range(0, 1) < 0.3) g.set(wx, wy, color('lamp'));
      }
    }
    x = bx + bw + pt(city.range(0, 2));
  }

  const amplitude = pt(5);
  const hillTop = x => horizon - amplitude * (0.7 + 0.5 * Math.sin(x / gw * 2 * Math.PI * 1.3 + 0.8) + 0.3 * Math.sin(x / gw * 2 * Math.PI * 3.1));
  g.shape(0, horizon - amplitude * 2, gw, gh, (px, py) => py >= hillTop(px), color('snow-shade'));

  const speckle = new Rand(41);
  g.shape(0, gh * 0.8, gw, gh, (px, py) => py >= ground(px), () => {
    if (STYLE.grain && speckle.range(0, 1) < 0.07) return color('snow-shade');
    return color('snow');
  });
  if (STYLE.outline) {
    for (let px = 0; px < gw; px++) g.set(px, Math.floor(ground(px + 0.5)), color('snow-shade'));
  }

  // 겨울 나무는 눈 얹힌 침엽수로 그린다. 앙상한 가지는 도트 몇 칸으로는 알아보기 어렵다.
  const trees = new Rand(13);
  const count = Math.max(4, Math.floor(gw * STYLE.dot / 42));
  for (let i = 0; i < count; i++) {
    const tx = Math.round((i + 0.5 + trees.range(-0.25, 0.25)) / count * gw);
    const base = Math.round(ground(tx) + pt(2));
    const height = Math.max(4, Math.round(pt(trees.range(18, 28))));
    g.rect(tx, base - Math.max(1, Math.round(height * 0.15)), 1, Math.max(1, Math.round(height * 0.15)), color('pine'));
    for (let k = 0; k < 3; k++) {
      const top = base - height + height * 0.22 * k, bottom = top + height * 0.45;
      const hw = height * 0.38 * (0.55 + 0.25 * k);
      const tier = (px, py) => py >= top && py <= bottom && Math.abs(px - (tx + 0.5)) <= hw * (py - top) / (bottom - top) + 0.3;
      g.shape(tx - hw, top, tx + hw + 1, bottom, tier, (px, py) => {
        // 층마다 아래쪽 어깨에 눈이 얹힌다. 투박형은 외곽선 그림이라 눈을 얹지 않는다.
        if (!STYLE.outline && py + 0.5 > (top + bottom) / 2 && !tier(px + 0.5, py - 0.5)) return color('snow');
        return color('pine');
      });
    }
  }
}

// ---- 창틀·창살·창턱. 좌표는 위젯 전체 칸 ----

function drawFrame(g, geo) {
  const { cols, rows, F, M, S, sillTop, glass } = geo;
  const sillY = rows - S;
  const inGlass = (x, y) => x >= glass.x && x < glass.x + glass.w && y >= glass.y && y < glass.y + glass.h;
  for (let y = 0; y < sillY; y++) {
    for (let x = 0; x < cols; x++) {
      if (inGlass(x, y)) continue;
      let c = color('frame');
      if (y === 0 || x === 0) c = color('frame-light');
      // 유리 둘레 안쪽 경사면: 위·왼쪽은 그늘, 아래·오른쪽은 밝다.
      if (y === glass.y - 1 && x >= glass.x - 1 && x <= glass.x + glass.w) c = color('frame-shade');
      if (x === glass.x - 1 && y >= glass.y && y < glass.y + glass.h) c = color('frame-shade');
      if (y === glass.y + glass.h && x >= glass.x && x <= glass.x + glass.w) c = color('frame-light');
      if (x === glass.x + glass.w && y >= glass.y && y < glass.y + glass.h) c = color('frame-light');
      g.set(x, y, c);
    }
  }
  // 창틀 그림자가 유리 위쪽·왼쪽 안으로 한 칸 진다. 투박형은 유리 둘레 전체에 외곽선을 두른다.
  const edge = color('glass-edge');
  g.rect(glass.x, glass.y, glass.w, 1, edge);
  g.rect(glass.x, glass.y, 1, glass.h, edge);
  if (STYLE.outline) {
    g.rect(glass.x, glass.y + glass.h - 1, glass.w, 1, edge);
    g.rect(glass.x + glass.w - 1, glass.y, 1, glass.h, edge);
  }
  const vx = glass.x + Math.floor((glass.w - M) / 2), hy = glass.y + Math.floor((glass.h - M) / 2);
  if (!STYLE.outline) {
    g.rect(vx + M, glass.y, 1, glass.h, edge);
    g.rect(glass.x, hy + M, glass.w, 1, edge);
  }
  g.rect(vx, glass.y, M, glass.h, color('frame'));
  g.rect(glass.x, hy, glass.w, M, color('frame'));
  g.rect(0, sillY, cols, sillTop, color('frame-light'));
  g.rect(0, sillY + sillTop, cols, 1, color('frame-shade'));
  g.rect(0, sillY + sillTop + 1, cols, rows, color('frame'));
}

// ---- 크리스마스 전구. 창틀 위에 걸고 창 안쪽으로 조금 처진다 ----

function drawChristmasLights(g, geo) {
  const { cols, F, S, rows } = geo;
  const sillY = rows - S;
  const inset = F * 0.5;
  const spacing = pt(36);
  const runs = [];
  const across = Math.max(3, Math.floor((cols - inset * 2) / spacing));
  for (let i = 0; i < across; i++) {
    const x0 = inset + (cols - inset * 2) * i / across, x1 = inset + (cols - inset * 2) * (i + 1) / across;
    runs.push([[x0, inset], [x1, inset], [0, F * 1.6]]);
  }
  const down = Math.max(2, Math.floor((sillY - inset) / spacing));
  for (const side of [inset, cols - inset]) {
    const bulge = side < cols / 2 ? F * 1.2 : -F * 1.2;
    for (let i = 0; i < down; i++) {
      const y0 = inset + (sillY - inset) * i / down, y1 = inset + (sillY - inset) * (i + 1) / down;
      runs.push([[side, y0], [side, y1], [bulge, 0]]);
    }
  }
  const quad = (a, c, b, t) => [0, 1].map(k => (1 - t) ** 2 * a[k] + 2 * (1 - t) * t * c[k] + t * t * b[k]);
  const wire = [], bulbs = [];
  for (const [a, b, sag] of runs) {
    const control = [(a[0] + b[0]) / 2 + sag[0], (a[1] + b[1]) / 2 + sag[1]];
    const steps = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 3);
    for (let s = 0; s <= steps; s++) wire.push(quad(a, control, b, s / steps));
    // 차분하게 보이도록 처진 줄 가운데에 하나씩만 단다.
    bulbs.push(quad(a, control, b, 0.5));
  }
  const palette = ['bulb-red', 'bulb-yellow', 'bulb-green', 'bulb-blue'].map(color);
  const bw = Math.max(1, Math.round(pt(3))), bh = Math.max(1, Math.round(pt(5)));
  const spots = bulbs.map(([x, y], i) => ({ x: Math.floor(x) - Math.floor((bw - 1) / 2), y: Math.floor(y) + 1, c: palette[i % palette.length] }));
  if (STYLE.glow > 0) {
    for (const s of spots) {
      const cx = s.x + bw / 2, cy = s.y + bh / 2, r = STYLE.glow + Math.max(bw, bh) / 2;
      g.shape(cx - r, cy - r, cx + r, cy + r, (x, y) => Math.hypot(x - cx, y - cy) <= r, (x, y) => ((x + y) % 2 === 0 ? s.c : null));
    }
  }
  for (const [x, y] of wire) g.set(x, y, color('wire'));
  for (const s of spots) g.rect(s.x, s.y, bw, bh, s.c);
}

// ---- 조립 ----

function widget(sizeKey) {
  const [w, h] = SIZES[sizeKey];
  const D = STYLE.dot;
  const geo = windowGeometry(w, h);
  const g = new Grid(geo.cols, geo.rows);
  const { glass } = geo;
  g.within(glass.x, glass.y, glass.w, glass.h, () => {
    drawSky(g, glass.w, glass.h);
    drawStars(g, glass.w, glass.h);
    drawMoon(g, glass.w, glass.h);
    drawClouds(g, glass.w, glass.h);
    drawLandscape(g, glass.w, glass.h);
  });
  drawFrame(g, geo);
  drawChristmasLights(g, geo);

  const box = document.createElement('div');
  box.className = `widget ${sizeKey}`;
  box.style.width = `${w}px`;
  box.style.height = `${h}px`;
  const canvas = g.canvas();
  canvas.className = 'dots';
  canvas.setAttribute('aria-hidden', 'true');
  Object.assign(canvas.style, { width: `${geo.cols * D}px`, height: `${geo.rows * D}px`, left: `${-geo.offset[0]}px`, top: `${-geo.offset[1]}px` });
  box.append(canvas);

  const captionTop = (geo.rows - geo.S + geo.sillTop) * D - geo.offset[1];
  const details = sizeKey === 'small' ? SCENE.occasion : `${SCENE.region} · ${SCENE.occasion}`;
  box.insertAdjacentHTML('beforeend',
    `<div class="caption${sizeKey === 'large' ? ' large' : ''}" style="top:${captionTop}px;width:${w}px;height:${h - captionTop}px;padding:0 ${geo.F * D * 1.2}px" role="img" aria-label="${SCENE.region}, ${SCENE.time}, ${SCENE.temperature}°, ${SCENE.occasion}">` +
    `<div class="caption-line"><span class="time">${SCENE.time}</span><span class="temp">${SCENE.temperature}°</span><span class="spacer"></span><span class="details">${details}</span></div></div>`);
  return box;
}

document.getElementById('title').textContent = `도트 시안 ${STYLE.key} · ${STYLE.name}`;
document.getElementById('spec').textContent = [
  `한 칸 ${STYLE.dot}pt`,
  STYLE.outline ? '색 외곽선' : '외곽선 없음',
  STYLE.dither === 0 ? '디더링 없음' : STYLE.dither < 1 ? '색 띠 경계만 디더링' : '디더링 많이',
  STYLE.grain ? '거친 질감' : '깔끔한 덩어리',
  '장면: 서울 12월 24일 오후 9:00, 맑음, 크리스마스 이브',
].join(' · ');
document.getElementById('sizes').append(...Object.keys(SIZES).map(widget));

// Swift 캡션의 minimumScaleFactor(0.6) 처럼, 넘치면 글자를 줄여 끝까지 보여준다.
for (const line of document.querySelectorAll('.caption-line')) {
  const spans = [...line.children].filter(s => !s.classList.contains('spacer'));
  const sizes = spans.map(s => parseFloat(getComputedStyle(s).fontSize));
  for (let k = 1; k > 0.6 && spans.some(s => s.scrollWidth > s.clientWidth + 0.5); ) {
    k -= 0.05;
    spans.forEach((s, i) => { s.style.fontSize = `${sizes[i] * k}px`; });
  }
}
</script>
</body>
</html>
