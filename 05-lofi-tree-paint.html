<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lofi 트리 회화풍</title>
<link rel="stylesheet" href="design.css">
<style>
  header {
    padding: 32px 24px 8px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0;
    color: var(--page-muted);
    font-size: 0.875rem;
  }
  main {
    padding: 24px 24px 64px;
  }
  .sizes {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: var(--page-gap);
  }
  .widget {
    background: var(--lofi-wood-dark);
  }
  .caption {
    color: var(--lofi-caption);
  }
</style>
</head>
<body>
<header>
  <h1>lofi 트리 · 회화풍</h1>
  <p>04-lofi-paint 에서 스탠드와 창 전구를 빼고, 방 구석의 크리스마스 트리를 방 안 불빛으로 삼았다. 장면 하나를 크기마다 다르게 잘라 보여준다. 흐림·노이즈 필터를 써서 DESIGN.md 의 "필터 금지"에서 벗어난다.</p>
</header>
<main>
  <div class="sizes" id="sizes"></div>
</main>

<script>
const SCENE = { region: '서울', time: '오후 9:00', temperature: -5, occasion: '크리스마스 이브' };
// 480×400 원본 장면에서 크기마다 잘라 낼 영역 [x, y, w, h]. 캡션 띠는 원본 y 360 아래다.
const CROPS = {
  small: { size: [170, 170], view: [200, 160, 240, 240] },
  medium: { size: [364, 170], view: [0, 160, 480, 224] },
  large: { size: [364, 382], view: [40, 0, 381, 400] },
};
const CAPTION_Y = 360;
const TREE = { x: 392, tiers: [[248, 336, 52], [214, 290, 40], [186, 246, 28]] };

const rootStyle = getComputedStyle(document.documentElement);
const c = name => {
  const value = rootStyle.getPropertyValue('--lofi-' + name).trim();
  if (!value) throw new Error(`design.css 에 --lofi-${name} 이 없다`);
  return value;
};

// 시드 고정 난수. 회화풍은 Swift 와 수열을 맞출 필요가 없어 짧은 mulberry32 를 쓴다.
function rand(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 세 층 트리. 층마다 처진 전구 줄 하나, 꼭대기에 별.
function tree(id) {
  const { x: cx, tiers } = TREE;
  const bulbs = ['bulb-1', 'bulb-2', 'lamp-light', 'bulb-3', 'bulb-4'];
  let out = `<rect x="${cx - 4}" y="330" width="8" height="10" fill="${c('wood-dark')}"/>` +
    `<path d="M370 336 H414 L408 360 H376 Z" fill="${c('pot')}"/>`;
  let k = 0;
  for (const [apex, base, hw] of tiers) {
    out += `<path d="M${cx} ${apex} L ${cx + hw} ${base} Q ${cx} ${base + 10} ${cx - hw} ${base} Z" fill="${c('tree')}"/>` +
      `<path d="M${cx} ${apex} L ${cx - hw} ${base} Q ${cx - hw * 0.6} ${base + 6} ${cx - hw * 0.25} ${base + 8} Z" fill="${c('tree-dark')}"/>`;
    const yy = apex + (base - apex) * 0.7, w = hw * 0.7 * 0.9;
    const p0 = [cx - w, yy - 4], p1 = [cx, yy + 12], p2 = [cx + w, yy + 6];
    const at = t => [0, 1].map(i => (1 - t) ** 2 * p0[i] + 2 * (1 - t) * t * p1[i] + t * t * p2[i]);
    out += `<path d="M${p0} Q ${p1} ${p2}" stroke="${c('wire')}" stroke-width="1" fill="none"/>`;
    const n = Math.round(hw / 9);
    for (let i = 0; i < n; i++, k++) {
      const [bx, by] = at((i + 0.5) / n).map(v => v.toFixed(1)), color = c(bulbs[k % bulbs.length]);
      out += `<circle cx="${bx}" cy="${by}" r="5" fill="${color}" opacity="0.35" filter="url(#${id}-glow)"/><circle cx="${bx}" cy="${by}" r="2.2" fill="${color}"/>`;
    }
  }
  const star = Array.from({ length: 10 }, (_, i) => {
    const r = i % 2 ? 4 : 9, a = -Math.PI / 2 + i * Math.PI / 5;
    return `${(cx + r * Math.cos(a)).toFixed(1)},${(182 + r * Math.sin(a)).toFixed(1)}`;
  }).join(' ');
  return out + `<circle cx="${cx}" cy="182" r="12" fill="${c('lamp-light')}" opacity="0.4" filter="url(#${id}-glow)"/><polygon points="${star}" fill="${c('lamp-light')}"/>`;
}

function scene(id) {
  const r = rand(11);
  const stars = Array.from({ length: 34 }, () =>
    `<circle cx="${(64 + r() * 176).toFixed(1)}" cy="${(40 + r() * 140).toFixed(1)}" r="${(0.5 + r() * 0.9).toFixed(2)}" fill="${c(r() < 0.3 ? 'star' : 'star-dim')}"/>`).join('');

  // 창밖 건물: 먼 줄과 가까운 줄. 불 켜진 창은 호박색.
  const city = [];
  for (const [fill, base, minH, maxH, lit] of [[c('city-far'), 250, 40, 80, 0.15], [c('city'), 290, 25, 60, 0.3]]) {
    let x = 56;
    while (x < 244) {
      const w = 18 + r() * 26, h = minH + r() * (maxH - minH), top = base - h;
      city.push(`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(300 - top).toFixed(1)}" fill="${fill}"/>`);
      if (fill === c('city')) city.push(`<rect x="${x.toFixed(1)}" y="${(top - 1.5).toFixed(1)}" width="${w.toFixed(1)}" height="2.5" rx="1.2" fill="${c('snow')}"/>`);
      for (let wy = top + 5; wy < 296; wy += 7) {
        for (let wx = x + 3; wx < x + w - 4; wx += 6) {
          if (r() < lit) city.push(`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="3.5" fill="${c('window-lit')}" filter="url(#${id}-soft)"/>`);
        }
      }
      x += w + r() * 4;
    }
  }

  return `
  <defs>
    <linearGradient id="${id}-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c('sky-1')}"/>
      <stop offset="0.45" stop-color="${c('sky-2')}"/>
      <stop offset="0.75" stop-color="${c('sky-3')}"/>
      <stop offset="1" stop-color="${c('sky-4')}"/>
    </linearGradient>
    <radialGradient id="${id}-warm" cx="${TREE.x}" cy="270" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${c('wall-warmer')}"/>
      <stop offset="0.35" stop-color="${c('wall-warm')}"/>
      <stop offset="1" stop-color="${c('wall')}"/>
    </radialGradient>
    <radialGradient id="${id}-desk" cx="${TREE.x}" cy="318" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="${c('desk-lit')}"/>
      <stop offset="1" stop-color="${c('wood-light')}"/>
    </radialGradient>
    <radialGradient id="${id}-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="${c('lamp-light')}" stop-opacity="0.3"/>
      <stop offset="1" stop-color="${c('lamp-light')}" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="${id}-glass"><rect x="62" y="38" width="180" height="262"/></clipPath>
    <filter id="${id}-soft"><feGaussianBlur stdDeviation="0.6"/></filter>
    <filter id="${id}-glow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="${id}-grain" x="0" y="0" width="1" height="1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.10 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- 벽: 트리 쪽이 따뜻하다 -->
  <rect width="480" height="400" fill="url(#${id}-warm)"/>

  <!-- 창밖 -->
  <g clip-path="url(#${id}-glass)">
    <rect x="62" y="38" width="180" height="262" fill="url(#${id}-sky)"/>
    ${stars}
    <circle cx="110" cy="104" r="26" fill="${c('halo')}" opacity="0.8" filter="url(#${id}-glow)"/>
    <circle cx="110" cy="104" r="12" fill="${c('moon')}"/>
    ${city.join('')}
  </g>

  <!-- 창틀과 창살 -->
  <path d="M54 30 H250 V306 H54 Z M62 38 V300 H242 V38 Z" fill-rule="evenodd" fill="${c('wood')}"/>
  <rect x="54" y="30" width="196" height="3" fill="${c('wood-light')}"/>
  <rect x="150" y="38" width="4" height="262" fill="${c('wood')}"/>
  <rect x="62" y="146" width="180" height="4" fill="${c('wood')}"/>
  <rect x="48" y="298" width="208" height="8" rx="2" fill="${c('wood-light')}"/>

  <!-- 커튼 -->
  <path d="M34 22 C 50 22 66 24 70 30 C 64 110 74 200 66 304 L 34 304 Z" fill="${c('curtain')}"/>
  <path d="M42 26 C 46 120 54 200 48 304" stroke="${c('curtain-dark')}" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M58 30 C 56 120 64 220 58 304" stroke="${c('curtain-dark')}" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 창턱의 고양이 뒷모습 -->
  <g transform="translate(100 298)">
    <path d="M-14 0 C -16 -12 -12 -22 -6 -24 L -9 -33 L -2 -27 C 1 -28 4 -28 6 -27 L 11 -34 L 10 -23 C 15 -18 16 -8 15 0 Z" fill="${c('cat')}"/>
    <path d="M10 -23 C 15 -18 16 -8 15 0 L 12 0 C 13 -8 12 -16 9 -21 Z" fill="${c('cat-rim')}"/>
    <path d="M15 -2 C 24 -2 28 -6 26 -12" stroke="${c('cat')}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 창턱 화분 -->
  <g transform="translate(232 298)">
    <path d="M-7 0 L -6 -9 H 6 L 7 0 Z" fill="${c('pot')}"/>
    <ellipse cx="-4" cy="-13" rx="5" ry="3" fill="${c('plant')}" transform="rotate(-30 -4 -13)"/>
    <ellipse cx="4" cy="-14" rx="5" ry="3" fill="${c('plant-dark')}" transform="rotate(25 4 -14)"/>
    <ellipse cx="0" cy="-17" rx="3" ry="5" fill="${c('plant')}"/>
  </g>

  <!-- 선반. small·medium 은 위를 잘라서 large 에서만 보인다 -->
  <g>
    <rect x="270" y="128" width="104" height="4" fill="${c('wood-light')}"/>
    <rect x="272" y="132" width="100" height="3" fill="${c('wood-dark')}"/>
    <rect x="280" y="104" width="7" height="24" fill="${c('book-1')}"/>
    <rect x="287" y="108" width="6" height="20" fill="${c('book-2')}"/>
    <rect x="293" y="101" width="8" height="27" fill="${c('book-3')}"/>
    <rect x="301" y="110" width="6" height="18" fill="${c('book-1')}" transform="rotate(12 307 128)"/>
    <path d="M348 128 L 350 116 H 364 L 366 128 Z" fill="${c('pot')}"/>
    <path d="M352 130 C 348 140 354 150 350 158 M357 130 C 358 140 362 148 360 156 M362 130 C 366 138 366 144 370 150" stroke="${c('plant-dark')}" stroke-width="2" fill="none"/>
    <path d="M350 142 l -4 2 M 353 152 l -4 2 M 360 146 l 4 2 M 367 140 l 4 1" stroke="${c('plant')}" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="357" cy="113" rx="9" ry="5" fill="${c('plant')}"/>
  </g>

  <!-- 책상은 트리 앞에서 끝난다 -->
  <rect x="0" y="306" width="334" height="8" fill="url(#${id}-desk)"/>
  <rect x="0" y="314" width="334" height="${CAPTION_Y - 314}" fill="${c('wood')}"/>

  <!-- 책, 머그 -->
  <rect x="192" y="298" width="40" height="5" rx="1" fill="${c('book-1')}"/>
  <rect x="196" y="293" width="34" height="5" rx="1" fill="${c('book-2')}"/>
  <rect x="194" y="303" width="42" height="5" rx="1" fill="${c('book-3')}"/>
  <g transform="translate(262 308)">
    <path d="M0 0 V -16 H 14 V 0 Z" fill="${c('mug')}"/>
    <rect x="0" y="-16" width="4" height="16" fill="${c('mug-dark')}"/>
    <path d="M14 -12 C 20 -12 20 -4 14 -4" stroke="${c('mug')}" stroke-width="2.5" fill="none"/>
    <path d="M4 -20 C 1 -25 8 -28 5 -34 M10 -20 C 7 -26 13 -29 10 -36" stroke="${c('steam')}" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- 트리와 그 둘레 불빛 -->
  <circle cx="${TREE.x}" cy="270" r="110" fill="url(#${id}-pool)"/>
  ${tree(id)}

  <!-- 사람 뒷모습. 오른쪽(트리 쪽) 가장자리에 따뜻한 테두리 빛 -->
  <g transform="translate(316 360)">
    <path d="M-48 0 C -50 -40 -40 -66 -22 -72 L 22 -72 C 40 -66 50 -40 48 0 Z" fill="${c('hoodie')}"/>
    <path d="M-20 -72 C -12 -60 12 -60 20 -72 C 14 -80 -14 -80 -20 -72 Z" fill="${c('hoodie-dark')}"/>
    <path d="M-4 -60 V -20" stroke="${c('hoodie-dark')}" stroke-width="2"/>
    <path d="M38 -62 C 46 -50 50 -30 48 0 L 42 0 C 44 -26 42 -48 34 -60 Z" fill="${c('hoodie-rim')}"/>
    <rect x="-7" y="-82" width="14" height="10" fill="${c('skin')}"/>
    <rect x="3" y="-82" width="4" height="10" fill="${c('hoodie-rim')}"/>
    <ellipse cx="0" cy="-104" rx="24" ry="27" fill="${c('hair')}"/>
    <path d="M14 -124 C 26 -112 26 -94 18 -82 L 14 -84 C 20 -96 20 -110 10 -122 Z" fill="${c('hair-rim')}"/>
    <circle cx="-2" cy="-136" r="10" fill="${c('hair')}"/>
    <path d="M4 -144 C 10 -140 10 -132 6 -128" stroke="${c('hair-rim')}" stroke-width="2.5" fill="none"/>
    <path d="M-26 -104 C -26 -134 26 -134 26 -104" stroke="${c('headphone')}" stroke-width="5" fill="none"/>
    <rect x="-31" y="-110" width="9" height="18" rx="4" fill="${c('headphone-accent')}"/>
    <rect x="22" y="-110" width="9" height="18" rx="4" fill="${c('headphone-accent')}"/>
  </g>

  <!-- 캡션 띠: 가장 앞의 어두운 가장자리 -->
  <rect x="0" y="${CAPTION_Y}" width="480" height="${400 - CAPTION_Y}" fill="${c('wood-dark')}"/>

  <!-- 필름 그레인 -->
  <rect width="480" height="400" fill="#808080" filter="url(#${id}-grain)" style="mix-blend-mode: overlay"/>`;
}

function widget(sizeKey) {
  const { size: [w, h], view: [vx, vy, vw, vh] } = CROPS[sizeKey];
  const scale = w / vw;
  const box = document.createElement('div');
  box.className = `widget ${sizeKey}`;
  box.style.width = `${w}px`;
  box.style.height = `${h}px`;
  box.innerHTML = `<svg width="${w}" height="${h}" viewBox="${vx} ${vy} ${vw} ${vh}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${scene(sizeKey)}</svg>`;

  const captionTop = Math.round((CAPTION_Y - vy) * scale);
  const details = sizeKey === 'small' ? SCENE.occasion : `${SCENE.region} · ${SCENE.occasion}`;
  box.insertAdjacentHTML('beforeend',
    `<div class="caption${sizeKey === 'large' ? ' large' : ''}" style="top:${captionTop}px;width:${w}px;height:${h - captionTop}px;padding:0 ${Math.round(Math.min(w, h) * 0.066)}px" role="img" aria-label="${SCENE.region}, ${SCENE.time}, ${SCENE.temperature}°, ${SCENE.occasion}">` +
    `<div class="caption-line"><span class="time">${SCENE.time}</span><span class="temp">${SCENE.temperature}°</span><span class="spacer"></span><span class="details">${details}</span></div></div>`);
  return box;
}

document.getElementById('sizes').append(...Object.keys(CROPS).map(widget));

for (const line of document.querySelectorAll('.caption-line')) {
  const spans = [...line.children].filter(s => !s.classList.contains('spacer'));
  const sizes = spans.map(s => parseFloat(getComputedStyle(s).fontSize));
  for (let k = 1; k > 0.6 && spans.some(s => s.scrollWidth > s.clientWidth + 0.5); ) {
    k -= 0.05;
    spans.forEach((s, i) => { s.style.fontSize = `${sizes[i] * k}px`; });
  }
}
</script>
</body>
</html>
