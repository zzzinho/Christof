<script>
// 장면 값은 ChristofSnapshots 출력(2026년, 한국 지역)에서 가져왔다. 해·달 각도는 반올림한 값이다.
// sun: [고도, 방위각], moon: [위상, 고도, 방위각], weather: [종류, 강도, 구름양, 기온] 또는 null(오프라인)
const SCENES = [

  { title: '봄 낮 · 벚꽃', region: '대구', date: '4월 5일', time: '오전 11:00', hour: 11, season: 'spring', sun: [54, 141], moon: [0.59, -42, 271], weather: ['partlyCloudy', 0, 0.3, 17], occasions: [] },
  { title: '일출', region: '서울', date: '10월 18일', time: '오전 6:42', hour: 6, season: 'autumn', sun: [-1, 101], moon: [0.23, -75, 42], weather: ['clear', 0, 0.2, 9], occasions: ['sky.sunrise'] },
  { title: '일몰', region: '부산', date: '6월 21일', time: '오후 7:41', hour: 19, season: 'summer', sun: [-1, 300], moon: [0.23, 48, 219], weather: ['partlyCloudy', 0, 0.35, 24], occasions: ['sky.sunset'] },
  { title: '초승달 밤', region: '서울', date: '3월 22일', time: '오후 8:00', hour: 20, season: 'spring', sun: [-15, 283], moon: [0.13, 29, 276], weather: ['clear', 0, 0, 5], occasions: [] },
  { title: '추석 보름달', region: '서울', date: '9월 25일', time: '오후 9:00', hour: 21, season: 'autumn', sun: [-31, 296], moon: [0.46, 37, 132], weather: ['clear', 0, 0.05, 19], occasions: ['KR.chuseok', 'sky.fullMoon'] },
  { title: '비 오는 오후', region: '광주', date: '7월 10일', time: '오후 3:00', hour: 15, season: 'summer', sun: [56, 257], moon: [0.84, 6, 294], weather: ['rain', 0.6, 0.95, 24], occasions: [] },
  { title: '뇌우', region: '대전', date: '8월 5일', time: '오후 5:00', hour: 17, season: 'summer', sun: [29, 270], moon: [0.72, -36, 351], weather: ['thunderstorm', 0.8, 1, 27], occasions: [] },
  { title: '안개 낀 아침', region: '춘천', date: '11월 5일', time: '오전 7:30', hour: 7, season: 'autumn', sun: [5, 114], moon: [0.86, 49, 146], weather: ['fog', 0.7, 0.6, 6], occasions: [] },
  { title: '눈 오는 크리스마스', region: '서울', date: '12월 25일', time: '오전 10:00', hour: 10, season: 'winter', sun: [19, 143], moon: [0.54, -10, 313], weather: ['snow', 0.6, 0.9, -2], occasions: ['KR.christmas'] },
  { title: '크리스마스 이브 밤', region: '서울', date: '12월 24일', time: '오후 9:00', hour: 21, season: 'winter', sun: [-43, 272], moon: [0.52, 39, 84], weather: ['clear', 0, 0.1, -5], occasions: ['KR.christmasEve', 'sky.fullMoon'] },
  { title: '할로윈 밤', region: '서울', date: '10월 31일', time: '오후 8:00', hour: 20, season: 'autumn', sun: [-29, 274], moon: [0.7, -17, 37], weather: ['partlyCloudy', 0, 0.4, 12], occasions: ['KR.halloween'] },
  { title: '설날 아침', region: '서울', date: '2월 17일', time: '오전 8:00', hour: 8, season: 'winter', sun: [7, 111], moon: [0.98, 8, 118], weather: ['clear', 0, 0.1, -3], occasions: ['KR.seollal'] },
  { title: '부처님오신날 해 질 녘', region: '서울', date: '5월 24일', time: '오후 7:41', hour: 19, season: 'spring', sun: [-1, 297], moon: [0.28, 57, 186], weather: ['clear', 0, 0.1, 20], occasions: ['KR.buddhasBirthday', 'sky.sunset'] },
  { title: '가을 단풍 낮', region: '전주', date: '10월 25일', time: '오후 2:00', hour: 14, season: 'autumn', sun: [36, 212], moon: [0.46, -30, 47], weather: ['clear', 0, 0.15, 16], occasions: [] },
  { title: '날씨 없음 (오프라인) 밤', region: '제주', date: '1월 10일', time: '오후 11:00', hour: 23, season: 'winter', sun: [-65, 291], moon: [0.75, -23, 88], weather: null, occasions: [] },
  { title: '정월대보름 밤', region: '서울', date: '3월 3일', time: '오후 9:00', hour: 21, season: 'spring', sun: [-31, 287], moon: [0.5, 30, 107], weather: ['clear', 0, 0.05, 2], occasions: ['KR.jeongwolDaeboreum', 'sky.fullMoon'] },
  { title: '새해 첫 일출', region: '강릉', date: '1월 1일', time: '오전 7:39', hour: 7, season: 'winter', sun: [-1, 119], moon: [0.4, -19, 328], weather: ['clear', 0, 0.1, -6], occasions: ['KR.newYearsDay', 'sky.sunrise'] },
  { title: '따뜻한 겨울 낮', region: '부산', date: '1월 15일', time: '오후 2:00', hour: 14, season: 'winter', sun: [30, 204], moon: [0.89, 2, 234], weather: ['clear', 0, 0.1, 8], occasions: [] },
];

// KoreaOccasions·CelestialOccasions 와 같은 이름·장식. 앞에 있을수록 우선순위가 높다.
const OCCASIONS = {
  'KR.seollal': { name: '설날', decorations: ['luckyPouch'] },
  'KR.jeongwolDaeboreum': { name: '정월대보름', decorations: ['fullMoon'] },
  'KR.buddhasBirthday': { name: '부처님오신날', decorations: ['lotusLantern'] },
  'KR.chuseok': { name: '추석', decorations: ['fullMoon'] },
  'KR.newYearsDay': { name: '새해 첫날', decorations: ['luckyPouch'] },
  'KR.halloween': { name: '할로윈', decorations: ['jackOLantern'] },
  'KR.christmasEve': { name: '크리스마스 이브', decorations: ['christmasLights'] },
  'KR.christmas': { name: '크리스마스', decorations: ['christmasLights'] },
  'sky.sunrise': { name: '일출', decorations: [] },
  'sky.sunset': { name: '일몰', decorations: [] },
  'sky.fullMoon': { name: '보름달', decorations: [] },
};

// WindowSize.referenceSize
const SIZES = { small: [170, 170], medium: [364, 170], large: [364, 382] };

// ---- 색 ----

const rootStyle = getComputedStyle(document.documentElement);
function color(name) {
  const value = rootStyle.getPropertyValue('--' + name).trim();
  if (!/^#[0-9a-f]{6}$/i.test(value)) throw new Error(`design.css 에 --${name} (#RRGGBB) 이 없다`);
  const n = parseInt(value.slice(1), 16);
  return { r: (n >> 16 & 255) / 255, g: (n >> 8 & 255) / 255, b: (n & 255) / 255 };
}
const WHITE = { r: 1, g: 1, b: 1 };
const BLACK = { r: 0, g: 0, b: 0 };
const mix = (a, b, t) => ({ r: a.r + (b.r - a.r) * t, g: a.g + (b.g - a.g) * t, b: a.b + (b.b - a.b) * t });
const scale = (a, k) => ({ r: a.r * k, g: a.g * k, b: a.b * k });
const luminance = a => 0.2126 * a.r + 0.7152 * a.g + 0.0722 * a.b;
const channel = v => Math.round(Math.min(1, Math.max(0, v)) * 255);
const rgba = (a, opacity = 1) => `rgba(${channel(a.r)},${channel(a.g)},${channel(a.b)},${+Math.min(1, Math.max(0, opacity)).toFixed(3)})`;
const smoothstep = (lower, upper, x) => {
  const t = Math.min(1, Math.max(0, (x - lower) / (upper - lower)));
  return t * t * (3 - 2 * t);
};

// ---- 시드 난수: Swift SeededRandom(SplitMix64) + Double.random(in:using:) 와 같은 수열 ----

const MASK64 = (1n << 64n) - 1n;
class Rand {
  constructor(seed) { this.state = BigInt(seed); }
  next() {
    this.state = (this.state + 0x9E3779B97F4A7C15n) & MASK64;
    let z = this.state;
    z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & MASK64;
    z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & MASK64;
    return z ^ (z >> 31n);
  }
  below(bound) {
    let m = this.next() * bound;
    if ((m & MASK64) < bound) {
      const t = ((1n << 64n) - bound) % bound;
      while ((m & MASK64) < t) m = this.next() * bound;
    }
    return m >> 64n;
  }
  range(lower, upper) {
    const max = 1n << 53n;
    const r = this.below(max + 1n);
    if (r === max) return upper;
    return (upper - lower) * (Number(r) * (Number.EPSILON / 2)) + lower;
  }
}

// ---- SVG ----

const fx = n => +n.toFixed(2);
const pt = ([x, y]) => `${fx(x)} ${fx(y)}`;
class Path {
  constructor() { this.d = ''; }
  move(p) { this.d += `M${pt(p)}`; return this; }
  line(p) { this.d += `L${pt(p)}`; return this; }
  quad(to, control) { this.d += `Q${pt(control)} ${pt(to)}`; return this; }
  close() { this.d += 'Z'; return this; }
  rect(x, y, w, h) { this.d += `M${pt([x, y])}h${fx(w)}v${fx(h)}h${fx(-w)}Z`; return this; }
  ellipse(x, y, w, h) {
    const rx = w / 2, ry = h / 2, cx = x + rx, cy = y + ry;
    this.d += `M${pt([cx + rx, cy])}A${fx(rx)} ${fx(ry)} 0 1 1 ${pt([cx - rx, cy])}A${fx(rx)} ${fx(ry)} 0 1 1 ${pt([cx + rx, cy])}Z`;
    return this;
  }
  circle([cx, cy], r) { return this.ellipse(cx - r, cy - r, r * 2, r * 2); }
  roundRect(x, y, w, h, r) {
    this.d += `M${pt([x + r, y])}H${fx(x + w - r)}A${fx(r)} ${fx(r)} 0 0 1 ${pt([x + w, y + r])}V${fx(y + h - r)}A${fx(r)} ${fx(r)} 0 0 1 ${pt([x + w - r, y + h])}H${fx(x + r)}A${fx(r)} ${fx(r)} 0 0 1 ${pt([x, y + h - r])}V${fx(y + r)}A${fx(r)} ${fx(r)} 0 0 1 ${pt([x + r, y])}Z`;
    return this;
  }
  toString() { return this.d; }
}
const rect = (x, y, w, h) => new Path().rect(x, y, w, h);
const ellipse = (x, y, w, h) => new Path().ellipse(x, y, w, h);
const circle = (c, r) => new Path().circle(c, r);

let canvasCount = 0;
class Canvas {
  constructor() { this.uid = `w${canvasCount++}`; this.n = 0; this.defs = []; this.out = []; }
  id() { return `${this.uid}-${this.n++}`; }
  // stops: [[색, 투명도, 위치?], ...]. 위치를 빼면 고르게 나눈다(SwiftUI Gradient(colors:) 와 같다).
  stops(stops) {
    return stops.map(([c, o, at], i) => `<stop offset="${at ?? i / (stops.length - 1)}" stop-color="${rgba(c, o)}"/>`).join('');
  }
  linear(stops, [x1, y1], [x2, y2]) {
    const id = this.id();
    this.defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${fx(x1)}" y1="${fx(y1)}" x2="${fx(x2)}" y2="${fx(y2)}">${this.stops(stops)}</linearGradient>`);
    return `url(#${id})`;
  }
  // SwiftUI radialGradient(startRadius:endRadius:) 처럼 위치 0 이 startRadius, 1 이 endRadius 다.
  radial(stops, [cx, cy], startRadius, endRadius) {
    const id = this.id();
    this.defs.push(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${fx(cx)}" cy="${fx(cy)}" fx="${fx(cx)}" fy="${fx(cy)}" r="${fx(endRadius)}" fr="${fx(startRadius)}">${this.stops(stops)}</radialGradient>`);
    return `url(#${id})`;
  }
  fill(path, paint, rule) {
    this.out.push(`<path d="${path}" fill="${paint}"${rule ? ` fill-rule="${rule}"` : ''}/>`);
  }
  stroke(path, paint, width, cap = 'butt', join = 'miter') {
    this.out.push(`<path d="${path}" fill="none" stroke="${paint}" stroke-width="${fx(width)}" stroke-linecap="${cap}" stroke-linejoin="${join}"/>`);
  }
  text(string, [x, y], size, paint) {
    this.out.push(`<text x="${fx(x)}" y="${fx(y)}" font-size="${fx(size)}" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${paint}">${string}</text>`);
  }
  clip(path, draw) {
    const id = this.id();
    this.defs.push(`<clipPath id="${id}"><path d="${path}"/></clipPath>`);
    this.out.push(`<g clip-path="url(#${id})">`);
    draw();
    this.out.push('</g>');
  }
  translate(x, y, draw) {
    this.out.push(`<g transform="translate(${fx(x)} ${fx(y)})">`);
    draw();
    this.out.push('</g>');
  }
  svg(w, h) {
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs>${this.defs.join('')}</defs>${this.out.join('')}</svg>`;
  }
}

// ---- 장면 계산: SkyPalette, CelestialPosition, WindowGeometry ----

const GLOOM = { clear: 0, partlyCloudy: 0.1, overcast: 0.5, fog: 0.45, drizzle: 0.45, rain: 0.6, snow: 0.4, thunderstorm: 0.8 };
const CLOUD_DECK = new Set(['overcast', 'drizzle', 'rain', 'snow', 'thunderstorm']);
const RAIN = new Set(['drizzle', 'rain', 'thunderstorm']);
const STARS = new Set(['clear', 'partlyCloudy']);
const SKY_KEYFRAMES = [[-18, 'n18'], [-10, 'n10'], [-5, 'n5'], [-1, 'n1'], [3, '3'], [10, '10'], [25, '25'], [60, '60']];
const HORIZON = 0.72;

function clearSky(altitude) {
  const frames = SKY_KEYFRAMES.map(([alt, key]) => ({ alt, zenith: color(`sky-${key}-zenith`), horizon: color(`sky-${key}-horizon`) }));
  const upper = frames.findIndex(f => f.alt > altitude);
  if (upper === -1) return frames[frames.length - 1];
  if (upper === 0) return frames[0];
  const a = frames[upper - 1], b = frames[upper];
  const t = (altitude - a.alt) / (b.alt - a.alt);
  return { zenith: mix(a.zenith, b.zenith, t), horizon: mix(a.horizon, b.horizon, t) };
}

function dull(c, gloom) {
  const l = luminance(c);
  return scale(mix(c, { r: l, g: l, b: l }, gloom * 0.8), 1 - gloom * 0.45);
}

function skyPalette(sunAltitude, weather) {
  const gloom = weather ? Math.min(1, Math.max(GLOOM[weather.condition], weather.cloudCover * 0.35)) : 0;
  const sky = clearSky(sunAltitude);
  const daylight = smoothstep(-9, 6, sunAltitude);
  const dayCloud = mix(color('cloud-day'), sky.horizon, 0.3);
  const nightCloud = mix(color('cloud-night'), sky.horizon, 0.3);
  const visibility = 1 - gloom * 1.25;
  return {
    gloom,
    daylight,
    zenith: dull(sky.zenith, gloom),
    horizon: dull(sky.horizon, gloom),
    sun: mix(color('sun-low'), color('sun-high'), smoothstep(0, 20, sunAltitude)),
    cloud: scale(mix(nightCloud, dayCloud, daylight), 1 - gloom * 0.55),
    celestialVisibility: visibility > 0.05 ? visibility : null,
    shade(base) { return dull(mix(base, color('night-shade'), (1 - daylight) * 0.82), gloom * 0.6); },
  };
}

// 창은 남쪽을 바라본다(북반구). 결과는 유리 기준 단위 좌표.
function celestialPoint(altitude, azimuth) {
  if (altitude <= -2) return null;
  const d = ((azimuth - 180 + 180) % 360 + 360) % 360 - 180;
  const base = HORIZON - 0.035;
  const x = Math.min(0.95, Math.max(0.05, 0.5 + d / 135 * 0.45));
  const y = base - Math.pow(Math.min(Math.max(altitude, 0), 75) / 75, 0.75) * (base - 0.1);
  return [x, y];
}

function windowGeometry(w, h) {
  const frame = Math.min(w, h) * 0.055;
  const sillHeight = frame * 2.7;
  const sillY = h - sillHeight;
  const glass = { x: frame, y: frame, w: w - frame * 2, h: sillY - frame };
  const sillTop = { x: 0, y: sillY, w, h: sillHeight * 0.24 };
  const sillFace = { x: 0, y: sillTop.y + sillTop.h, w, h: h - (sillTop.y + sillTop.h) };
  return { frame, mullion: frame * 0.5, glass, sillTop, sillFace, radius: frame * 0.3 };
}

function sceneContext(scene) {
  const weather = scene.weather && {
    condition: scene.weather[0], intensity: scene.weather[1], cloudCover: scene.weather[2], temperature: scene.weather[3],
  };
  const palette = skyPalette(scene.sun[0], weather);
  const sunPoint = celestialPoint(scene.sun[0], scene.sun[1]);
  const moonPoint = celestialPoint(scene.moon[1], scene.moon[2]);
  const visibleMoon = scene.sun[0] < 0 && moonPoint && palette.celestialVisibility
    ? { point: moonPoint, visibility: palette.celestialVisibility } : null;
  return { ...scene, weather, palette, sunAltitude: scene.sun[0], sunPoint, moonPhase: scene.moon[0], visibleMoon };
}

// ---- 기본 레이어 (Rendering/Layers) ----
// 레이어: { id, onFrame?, depth, draw(c, w, h) }. 창밖 레이어의 w·h 는 유리 크기, 창틀 레이어는 위젯 크기.

function skyEffect(s) {
  const p = s.palette;
  return [{ id: 'sky', depth: 0, draw(c, w, h) {
    c.fill(rect(0, 0, w, h), c.linear([[p.zenith, 1], [mix(p.zenith, p.horizon, 0.45), 1], [p.horizon, 1]], [w / 2, 0], [w / 2, h * HORIZON]));
  } }];
}

function starEffect(s) {
  const p = s.palette;
  if (s.weather && !STARS.has(s.weather.condition)) return [];
  const opacity = (1 - p.daylight / 0.4) * (1 - p.gloom * 2);
  if (opacity <= 0.05) return [];
  return [{ id: 'stars', depth: 10, draw(c, w, h) {
    const u = Math.min(w, h);
    const random = new Rand(3);
    for (let i = 0; i < 70; i++) {
      const center = [random.range(0, 1) * w, random.range(0, 0.66) * h];
      const radius = u * random.range(0.003, 0.008);
      c.fill(circle(center, radius), rgba(WHITE, opacity * random.range(0.35, 1)));
    }
  } }];
}

function sunEffect(s) {
  const p = s.palette;
  if (!s.sunPoint || !p.celestialVisibility) return [];
  const visibility = p.celestialVisibility;
  // 지평선 가까운 해는 조금 크게 그린다(달·해 착시).
  const ratio = 0.075 * (1.3 - 0.3 * smoothstep(0, 15, s.sunAltitude));
  return [{ id: 'sun', depth: 20, draw(c, w, h) {
    const center = [s.sunPoint[0] * w, s.sunPoint[1] * h];
    const radius = Math.min(w, h) * ratio;
    const glow = radius * 4.5;
    c.fill(circle(center, glow), c.radial([[p.sun, 0.6 * visibility], [p.sun, 0]], center, radius * 0.6, glow));
    c.fill(circle(center, radius), rgba(p.sun, visibility));
  } }];
}

const MOON_RADIUS = 0.08;

// 차는 달(위상 < 0.5)은 북반구에서 오른쪽이 밝다. 경계선은 x 반지름이 cos(2π·위상)인 반타원.
function moonLitPath(phase, [cx, cy], r) {
  const k = Math.cos(phase * 2 * Math.PI);
  const [limb, terminator] = phase < 0.5 ? [1, k] : [-1, -k];
  const steps = 24;
  const edge = (side, i) => {
    const y = -r + 2 * r * i / steps;
    return [cx + side * Math.sqrt(Math.max(0, r * r - y * y)), cy + y];
  };
  const path = new Path().move(edge(limb, 0));
  for (let i = 1; i <= steps; i++) path.line(edge(limb, i));
  for (let i = steps; i >= 0; i--) path.line(edge(terminator, i));
  return path.close();
}

function moonEffect(s) {
  if (!s.visibleMoon) return [];
  const { point, visibility } = s.visibleMoon;
  return [{ id: 'moon', depth: 20, draw(c, w, h) {
    const center = [point[0] * w, point[1] * h];
    const radius = Math.min(w, h) * MOON_RADIUS;
    const light = color('moon-light');
    c.fill(circle(center, radius * 2.6), c.radial([[light, 0.22 * visibility], [light, 0]], center, radius, radius * 2.6));
    c.fill(circle(center, radius), rgba(WHITE, 0.08 * visibility));
    c.fill(moonLitPath(s.moonPhase, center, radius), rgba(light, visibility));
  } }];
}

function cloudEffect(s) {
  if (!s.weather) return [];
  const count = Math.round(s.weather.cloudCover * 7);
  const deck = CLOUD_DECK.has(s.weather.condition);
  if (count === 0 && !deck) return [];
  const cloud = s.palette.cloud;
  return [{ id: 'clouds', depth: 30, draw(c, w, h) {
    const u = Math.min(w, h);
    const random = new Rand(5);
    if (deck) c.fill(rect(0, 0, w, h), c.linear([[cloud, 0.95], [cloud, 0.7], [cloud, 0]], [0, 0], [0, h * 0.6]));
    for (let i = 0; i < count; i++) {
      const center = [random.range(-0.05, 1.05) * w, random.range(0.1, 0.42) * h];
      drawCloud(c, center, u * random.range(0.13, 0.2), cloud);
    }
  } }];
}

function drawCloud(c, [x, y], s, cloud) {
  const puff = new Path().ellipse(x - s * 1.2, y - s * 0.1, s * 2.4, s * 0.7);
  for (const [dx, dy, r] of [[-0.6, 0.05, 0.42], [-0.15, -0.25, 0.58], [0.4, -0.1, 0.5], [0.8, 0.1, 0.34]]) {
    puff.circle([x + s * dx, y + s * dy], s * r);
  }
  c.fill(puff, c.linear([[mix(cloud, WHITE, 0.15), 0.95], [scale(cloud, 0.85), 0.95]], [x, y - s * 0.8], [x, y + s * 0.6]));
}

function lightningEffect(s) {
  if (!s.weather || s.weather.condition !== 'thunderstorm') return [];
  const flash = 0.25 + 0.25 * s.weather.intensity;
  return [{ id: 'lightning', depth: 35, draw(c, w, h) {
    const u = Math.min(w, h);
    const random = new Rand(101 + s.hour);
    let point = [random.range(0.25, 0.75) * w, h * 0.15];
    // 번개가 시작하는 구름 속만 밝힌다. 화면 전체를 밝히면 뇌우가 비보다 밝아 보인다.
    c.fill(circle(point, u * 0.6), c.radial([[WHITE, flash], [WHITE, 0]], point, 0, u * 0.6));
    const bolt = new Path().move(point);
    let fork = null;
    while (point[1] < h * HORIZON) {
      const x = point[0] + u * random.range(-0.06, 0.06);
      point = [x, point[1] + h * random.range(0.05, 0.09)];
      bolt.line(point);
      if (!fork && point[1] > h * 0.35) fork = point;
    }
    if (fork) {
      bolt.move(fork).line([fork[0] + u * 0.08, fork[1] + h * 0.08]).line([fork[0] + u * 0.1, fork[1] + h * 0.15]);
    }
    c.stroke(bolt, rgba(color('lightning-glow'), 0.35), u * 0.03, 'round', 'round');
    c.stroke(bolt, rgba(WHITE), u * 0.009, 'round', 'round');
  } }];
}

function landscapeColors(season, snowCovered) {
  if (snowCovered) return { ground: color('snowfield-ground'), hill: color('snowfield-hill'), crowns: [], blossoms: false };
  const crowns = { spring: 2, summer: 3, autumn: 3, winter: 0 }[season];
  return {
    ground: color(`${season}-ground`),
    hill: color(`${season}-hill`),
    crowns: Array.from({ length: crowns }, (_, i) => color(`${season}-crown-${i + 1}`)),
    blossoms: season === 'spring',
  };
}

function landscapeEffect(s) {
  const p = s.palette;
  // 따뜻한 겨울(부산·제주)은 마른 땅으로 두고, 눈이 오거나 영하일 때만 눈밭으로 그린다.
  const snowCovered = !!s.weather && (s.weather.condition === 'snow' || (s.season === 'winter' && s.weather.temperature <= 0));
  const colors = landscapeColors(s.season, snowCovered);
  const lights = Math.max(0, 1 - p.daylight / 0.45);
  return [{ id: 'landscape', depth: 40, draw(c, w, h) {
    const u = Math.min(w, h);
    const horizon = h * HORIZON;
    drawCity(c, w, h, u, horizon, p, lights);
    drawHill(c, w, h, horizon, h * 0.022, 1.3, p.shade(mix(colors.hill, p.horizon, 0.25)));
    const ground = x => h * 0.83 + h * 0.025 * Math.sin(x / w * 2 * Math.PI * 0.8 + 2);
    const field = new Path().move([0, h]);
    for (let i = 0; i <= 24; i++) {
      const x = w * i / 24;
      field.line([x, ground(x)]);
    }
    field.line([w, h]).close();
    c.fill(field, rgba(p.shade(colors.ground)));
    drawTrees(c, w, h, u, ground, colors, p);
  } }];
}

function drawCity(c, w, h, u, horizon, p, lights) {
  const random = new Rand(11);
  const wall = rgba(p.shade(mix(color('city-wall'), p.horizon, 0.3)));
  const lamp = color('city-lamp');
  let x = w * 0.34;
  while (x < w * 0.68) {
    const width = u * random.range(0.05, 0.09);
    const height = u * random.range(0.07, 0.2);
    const top = horizon - height;
    c.fill(rect(x, top, width, height + h * 0.05), wall);
    if (lights > 0) {
      const cell = u * 0.024;
      for (let row = 0; row < Math.floor(height / cell); row++) {
        for (let col = 0; col < Math.floor(width / cell); col++) {
          if (random.range(0, 1) >= 0.45) continue;
          c.fill(rect(x + cell * (col + 0.3), top + cell * (row + 0.35), cell * 0.45, cell * 0.45), rgba(lamp, lights));
        }
      }
    }
    x += width + u * random.range(0, 0.012);
  }
}

function drawHill(c, w, h, top, height, wave, hillColor) {
  const hill = new Path().move([0, h]);
  for (let i = 0; i <= 32; i++) {
    const t = i / 32;
    const lift = 0.7 + 0.5 * Math.sin(t * 2 * Math.PI * wave + 0.8) + 0.3 * Math.sin(t * 2 * Math.PI * 3.1);
    hill.line([w * t, top - height * lift]);
  }
  hill.line([w, h]).close();
  c.fill(hill, rgba(hillColor));
}

function drawTrees(c, w, h, u, ground, colors, p) {
  const random = new Rand(13);
  const count = Math.max(4, Math.floor(w / u * 4));
  const bark = rgba(p.shade(color('bark')));
  for (let i = 0; i < count; i++) {
    const x = (i + 0.5 + random.range(-0.25, 0.25)) / count * w;
    const base = [x, ground(x) + u * 0.02];
    const height = u * random.range(0.12, 0.18);
    c.fill(rect(base[0] - height * 0.045, base[1] - height * 0.55, height * 0.09, height * 0.55), bark);
    const crownCenter = [base[0], base[1] - height * 0.66];
    if (colors.crowns.length === 0) {
      const branches = new Path();
      for (const [angle, length] of [[-0.7, 0.4], [0.6, 0.38], [-0.25, 0.45], [0.2, 0.42], [-1.0, 0.25], [0.95, 0.27]]) {
        const start = [base[0], base[1] - height * (0.35 + 0.15 * Math.abs(angle))];
        branches.move(start).line([start[0] + Math.sin(angle) * height * length, start[1] - Math.cos(angle) * height * length]);
      }
      c.stroke(branches, bark, height * 0.035, 'round');
      continue;
    }
    const crown = rgba(p.shade(colors.crowns[i % colors.crowns.length]));
    const r = height * 0.33;
    const [cx, cy] = crownCenter;
    const leaves = new Path()
      .circle([cx - r * 0.55, cy + r * 0.15], r * 0.75)
      .circle([cx + r * 0.55, cy + r * 0.15], r * 0.75)
      .circle([cx, cy - r * 0.25], r);
    c.fill(leaves, crown);
    if (colors.blossoms) {
      for (let k = 0; k < 7; k++) {
        const dot = [cx + r * random.range(-1, 1), cy + r * random.range(-0.9, 0.6)];
        c.fill(circle(dot, r * 0.12), rgba(p.shade(color('blossom'))));
      }
    }
  }
}

function rainEffect(s) {
  if (!s.weather || !RAIN.has(s.weather.condition)) return [];
  const drizzle = s.weather.condition === 'drizzle';
  const count = drizzle ? 40 + Math.trunc(60 * s.weather.intensity) : 70 + Math.trunc(130 * s.weather.intensity);
  const opacity = 0.35 + 0.25 * s.palette.daylight;
  return [{ id: 'rain', depth: 50, draw(c, w, h) {
    const u = Math.min(w, h);
    const length = h * (drizzle ? 0.035 : 0.08);
    const random = new Rand(17);
    const drops = new Path();
    for (let i = 0; i < count; i++) {
      const start = [random.range(-0.05, 1.05) * w, random.range(-0.05, 1) * h];
      drops.move(start).line([start[0] - length * 0.25, start[1] + length]);
    }
    c.stroke(drops, rgba(WHITE, opacity), u * (drizzle ? 0.005 : 0.007), 'round');
  } }];
}

function snowEffect(s) {
  if (!s.weather || s.weather.condition !== 'snow') return [];
  const count = 50 + Math.trunc(110 * s.weather.intensity);
  const snow = mix(color('snow-night'), color('snow-day'), s.palette.daylight);
  return [
    { id: 'snow', depth: 50, draw(c, w, h) {
      const u = Math.min(w, h);
      const random = new Rand(23);
      for (let i = 0; i < count; i++) {
        const center = [random.range(0, 1) * w, random.range(0, 1) * h];
        const radius = u * random.range(0.006, 0.016);
        c.fill(circle(center, radius), rgba(snow, random.range(0.7, 1)));
      }
    } },
    { id: 'snow.sill', onFrame: true, depth: 50, draw(c, w, h) {
      const top = windowGeometry(w, h).sillTop;
      const bump = top.h * 0.9;
      const steps = 12;
      const drift = new Path().move([0, top.y + top.h]).line([0, top.y - bump * 0.4]);
      for (let i = 1; i <= steps; i++) {
        const x = w * i / steps;
        const peak = bump * (0.6 + 0.4 * Math.sin(i * 1.7));
        drift.quad([x, top.y - bump * 0.4], [x - w / steps / 2, top.y - peak]);
      }
      drift.line([w, top.y + top.h]).close();
      c.fill(drift, c.linear([[snow, 1], [scale(snow, 0.9), 1]], [0, top.y - bump], [0, top.y + top.h]));
    } },
  ];
}

function fogEffect(s) {
  if (!s.weather || s.weather.condition !== 'fog') return [];
  const fog = mix(s.palette.cloud, WHITE, 0.2);
  const density = 0.45 + 0.4 * s.weather.intensity;
  return [{ id: 'fog', depth: 50, draw(c, w, h) {
    c.fill(rect(0, 0, w, h), c.linear([[fog, density * 0.35], [fog, density * 0.8], [fog, density]], [0, 0], [0, h]));
    for (let k = 0; k < 3; k++) {
      c.fill(ellipse(-w * 0.1, h * (0.5 + 0.12 * k), w * 1.2, h * 0.1), rgba(fog, density * 0.5));
    }
  } }];
}

const STANDARD_PROVIDERS = [skyEffect, starEffect, sunEffect, moonEffect, cloudEffect, lightningEffect, landscapeEffect, rainEffect, snowEffect, fogEffect];

// ---- 이벤트 장식 (Rendering/Decorations) ----

function fullMoonDecoration(s) {
  if (!s.visibleMoon) return [];
  const { point, visibility } = s.visibleMoon;
  return [{ id: 'decoration.fullMoon', depth: 19, draw(c, w, h) {
    const center = [point[0] * w, point[1] * h];
    const moon = Math.min(w, h) * MOON_RADIUS;
    const halo = moon * 5;
    const warm = color('fullmoon-halo');
    c.fill(circle(center, halo), c.radial([[warm, 0.7 * visibility, 0], [warm, 0.3 * visibility, 0.45], [warm, 0, 1]], center, moon, halo));
    c.stroke(circle(center, moon * 1.6), rgba(warm, 0.35 * visibility), moon * 0.12);
  } }];
}

const quadPoint = (a, control, b, t) => [
  (1 - t) * (1 - t) * a[0] + 2 * (1 - t) * t * control[0] + t * t * b[0],
  (1 - t) * (1 - t) * a[1] + 2 * (1 - t) * t * control[1] + t * t * b[1],
];

function christmasLightsDecoration(s) {
  const glow = 0.35 + 0.4 * Math.max(0, 1 - s.palette.daylight / 0.5);
  const bulbColors = [1, 2, 3, 4, 5].map(i => color(`lights-${i}`));
  return [{ id: 'decoration.christmasLights', onFrame: true, depth: 60, draw(c, w, h) {
    const g = windowGeometry(w, h);
    const u = Math.min(w, h);
    const inset = g.frame * 0.5;
    const spacing = u * 0.17;
    const runs = [];
    const across = Math.max(3, Math.floor((w - inset * 2) / spacing));
    for (let i = 0; i < across; i++) {
      const x0 = inset + (w - inset * 2) * i / across;
      const x1 = inset + (w - inset * 2) * (i + 1) / across;
      runs.push([[x0, inset], [x1, inset], [0, g.frame * 1.6]]);
    }
    const down = Math.max(2, Math.floor((g.sillTop.y - inset) / spacing));
    for (const side of [inset, w - inset]) {
      const bulge = side < w / 2 ? g.frame * 1.2 : -g.frame * 1.2;
      for (let i = 0; i < down; i++) {
        const y0 = inset + (g.sillTop.y - inset) * i / down;
        const y1 = inset + (g.sillTop.y - inset) * (i + 1) / down;
        runs.push([[side, y0], [side, y1], [bulge, 0]]);
      }
    }
    const wire = new Path();
    const bulbs = [];
    for (const [a, b, sag] of runs) {
      const control = [(a[0] + b[0]) / 2 + sag[0], (a[1] + b[1]) / 2 + sag[1]];
      wire.move(a).quad(b, control);
      for (const t of [0.33, 0.67]) bulbs.push(quadPoint(a, control, b, t));
    }
    const wireColor = color('lights-wire');
    c.stroke(wire, rgba(wireColor), Math.max(1, g.frame * 0.12));
    const r = g.frame * 0.3;
    bulbs.forEach((point, i) => {
      const bulbColor = bulbColors[i % bulbColors.length];
      const bulb = [point[0], point[1] + r * 1.1];
      c.fill(circle(bulb, r * 3.2), c.radial([[bulbColor, glow], [bulbColor, 0]], bulb, r * 0.5, r * 3.2));
      c.fill(rect(point[0] - r * 0.4, point[1] - r * 0.1, r * 0.8, r * 0.6), rgba(wireColor));
      c.fill(ellipse(bulb[0] - r * 0.75, bulb[1] - r * 0.6, r * 1.5, r * 2), rgba(mix(bulbColor, WHITE, 0.25)));
    });
  } }];
}

function jackOLanternDecoration(s) {
  const daylight = s.palette.daylight;
  const lights = Math.max(0, 1 - daylight / 0.5);
  return [{ id: 'decoration.jackOLantern', onFrame: true, depth: 60, draw(c, w, h) {
    const g = windowGeometry(w, h);
    const pw = Math.min(w, h) * 0.22;
    const ph = pw * 0.78;
    const bottom = g.sillTop.y + g.sillTop.h * 0.7;
    const [cx, cy] = [g.glass.x + g.glass.w - pw * 0.8, bottom - ph / 2];
    const candle = color('pumpkin-candle');
    if (lights > 0) {
      // 후광이 창턱 앞면(캡션)까지 번지지 않게 자른다.
      c.clip(rect(0, 0, w, g.sillFace.y), () => {
        c.fill(circle([cx, cy], pw * 1.3), c.radial([[candle, 0.5 * lights], [candle, 0]], [cx, cy], pw * 0.3, pw * 1.3));
      });
    }
    const skin = scale(color('pumpkin-skin'), 0.8 + 0.2 * daylight);
    const stem = new Path()
      .move([cx - pw * 0.05, cy - ph * 0.42])
      .quad([cx + pw * 0.08, cy - ph * 0.68], [cx - pw * 0.04, cy - ph * 0.62])
      .line([cx + pw * 0.12, cy - ph * 0.6])
      .quad([cx + pw * 0.06, cy - ph * 0.42], [cx + pw * 0.05, cy - ph * 0.55])
      .close();
    c.fill(stem, rgba(color('pumpkin-stem')));
    for (const [dx, sc, shade] of [[-0.24, 0.62, 0.82], [0.24, 0.62, 0.82], [0, 0.6, 1.0]]) {
      c.fill(ellipse(cx + pw * dx - pw * sc / 2, cy - ph / 2, pw * sc, ph), rgba(scale(skin, shade)));
    }
    const face = new Path();
    for (const side of [-1, 1]) {
      face.move([cx + side * pw * 0.26, cy - ph * 0.02]).line([cx + side * pw * 0.08, cy - ph * 0.02]).line([cx + side * pw * 0.17, cy - ph * 0.24]).close();
    }
    face.move([cx - pw * 0.3, cy + ph * 0.1]);
    for (const [x, y] of [[-0.2, 0.2], [-0.12, 0.13], [-0.04, 0.22], [0.04, 0.13], [0.12, 0.22], [0.2, 0.13], [0.3, 0.1]]) {
      face.line([cx + pw * x, cy + ph * y]);
    }
    face.quad([cx - pw * 0.3, cy + ph * 0.1], [cx, cy + ph * 0.55]).close();
    c.fill(face, rgba(mix(color('pumpkin-carved-dark'), color('pumpkin-carved-lit'), 0.3 + 0.7 * lights)));
  } }];
}

function lotusLanternDecoration(s) {
  const lights = Math.max(0, 1 - s.palette.daylight / 0.5);
  const bodies = [s.sunPoint, s.visibleMoon && s.visibleMoon.point].filter(Boolean);
  const lanternColors = [1, 2, 3, 4, 5, 6].map(i => color(`lantern-${i}`));
  return [{ id: 'decoration.lotusLantern', depth: 60, draw(c, w, h) {
    const u = Math.min(w, h);
    const end = h * 0.05, sag = h * 0.2;
    c.stroke(new Path().move([0, end]).quad([w, end], [w / 2, sag]), rgba(color('lantern-string'), 0.8), Math.max(0.8, u * 0.008));
    // 짝수여야 가운데 연등이 세로 창살 뒤에 걸리지 않는다.
    const count = Math.max(4, Math.floor(Math.floor(w / (u * 0.34)) / 2) * 2);
    const radius = u * 0.065;
    // 해·달을 가리지 않게 그 자리 연등은 뺀다.
    const clearance = u * 0.1 + radius * 1.7;
    for (let i = 0; i < count; i++) {
      const t = (i + 0.5) / count;
      const hook = [w * t, (1 - t) * (1 - t) * end + 2 * (1 - t) * t * sag + t * t * end];
      const center = [hook[0], hook[1] + radius * 1.6];
      if (bodies.some(b => Math.hypot(b[0] * w - center[0], b[1] * h - center[1]) < clearance)) continue;
      drawLantern(c, hook, radius, lanternColors[i % lanternColors.length], lights);
    }
  } }];
}

function drawLantern(c, hook, r, lanternColor, lights) {
  const [cx, cy] = [hook[0], hook[1] + r * 1.6];
  c.stroke(new Path().move(hook).line([hook[0], cy]), rgba(color('lantern-string')), Math.max(0.6, r * 0.08));
  if (lights > 0) {
    c.fill(circle([cx, cy], r * 3), c.radial([[mix(lanternColor, color('lantern-glow'), 0.5), 0.6 * lights], [lanternColor, 0]], [cx, cy], r * 0.5, r * 3));
  }
  const glow = mix(lanternColor, color('lantern-lit'), 0.45 * lights);
  const tassel = new Path();
  for (const dx of [-0.35, 0, 0.35]) tassel.move([cx + r * dx, cy + r * 0.7]).line([cx + r * dx * 1.2, cy + r * 1.7]);
  c.stroke(tassel, rgba(lanternColor), Math.max(0.6, r * 0.12));
  c.fill(ellipse(cx - r * 0.6, cy + r * 0.5, r * 1.2, r * 0.4), rgba(color('lantern-leaf')));
  c.fill(ellipse(cx - r, cy - r * 0.85, r * 2, r * 1.7), rgba(scale(glow, 0.88)));
  const petal = rgba(mix(glow, WHITE, 0.25));
  const edge = rgba(scale(glow, 0.7));
  [[0.45, 5, 0.75], [0, 4, 0.7], [-0.45, 3, 0.6]].forEach(([y, count, length], row) => {
    const span = r * (1.5 - 0.3 * row);
    for (let k = 0; k < count; k++) {
      const x = cx - span / 2 + span * (k + 0.5) / count;
      const base = [x, cy + r * y];
      const tilt = (x - cx) / r * 0.35;
      const tip = [base[0] + Math.sin(tilt) * r * length, base[1] - Math.cos(tilt) * r * length];
      const width = r * 0.24;
      const mid = (base[1] + tip[1]) / 2;
      const leaf = new Path().move([base[0] - width, base[1]]).quad(tip, [base[0] - width, mid]).quad([base[0] + width, base[1]], [base[0] + width, mid]).close();
      c.fill(leaf, petal);
      c.stroke(leaf, edge, Math.max(0.4, r * 0.05));
    }
  });
}

function luckyPouchDecoration() {
  return [{ id: 'decoration.luckyPouch', onFrame: true, depth: 60, draw(c, w, h) {
    const g = windowGeometry(w, h);
    const u = Math.min(w, h) * 0.22;
    const cx = g.glass.x + g.glass.w * 0.25;
    const top = g.glass.y + u * 0.2;
    const gold = rgba(color('pouch-gold'));
    c.stroke(new Path().move([cx, g.frame * 0.4]).line([cx, top]), rgba(color('pouch-cord')), Math.max(1, u * 0.03));
    const knotY = (g.frame * 0.4 + top) / 2;
    c.fill(new Path().move([cx, knotY - u * 0.05]).line([cx + u * 0.05, knotY]).line([cx, knotY + u * 0.05]).line([cx - u * 0.05, knotY]).close(), rgba(color('pouch-knot')));
    const ruffle = new Path()
      .move([cx - u * 0.12, top + u * 0.14])
      .quad([cx - u * 0.24, top - u * 0.02], [cx - u * 0.2, top + u * 0.1])
      .quad([cx, top - u * 0.04], [cx - u * 0.12, top + u * 0.04])
      .quad([cx + u * 0.24, top - u * 0.02], [cx + u * 0.12, top + u * 0.04])
      .quad([cx + u * 0.12, top + u * 0.14], [cx + u * 0.2, top + u * 0.1])
      .close();
    c.fill(ruffle, rgba(color('pouch-ruffle')));
    const body = new Path()
      .move([cx - u * 0.13, top + u * 0.17])
      .quad([cx - u * 0.4, top + u * 0.62], [cx - u * 0.4, top + u * 0.3])
      .quad([cx, top + u * 0.92], [cx - u * 0.4, top + u * 0.92])
      .quad([cx + u * 0.4, top + u * 0.62], [cx + u * 0.4, top + u * 0.92])
      .quad([cx + u * 0.13, top + u * 0.17], [cx + u * 0.4, top + u * 0.3])
      .close();
    c.fill(body, c.linear([[color('pouch-light'), 1], [color('pouch-dark'), 1]], [cx - u * 0.3, top], [cx + u * 0.3, top + u * 0.9]));
    c.fill(new Path().roundRect(cx - u * 0.16, top + u * 0.12, u * 0.32, u * 0.07, u * 0.03), gold);
    const emblem = [cx, top + u * 0.58];
    c.stroke(circle(emblem, u * 0.15), gold, Math.max(0.8, u * 0.025));
    c.text('福', emblem, u * 0.19, gold);
  } }];
}

const DECORATIONS = {
  fullMoon: fullMoonDecoration,
  christmasLights: christmasLightsDecoration,
  jackOLantern: jackOLanternDecoration,
  lotusLantern: lotusLanternDecoration,
  luckyPouch: luckyPouchDecoration,
};

// ---- 창틀 (WindowFrame) ----

function drawWindowFrame(c, g, w, h) {
  const glass = new Path().roundRect(g.glass.x, g.glass.y, g.glass.w, g.glass.h, g.radius);
  const paint = color('frame-paint');
  c.clip(glass, () => {
    const r = g.glass;
    const band = (from, width) => new Path()
      .move([r.x + r.w * from, r.y])
      .line([r.x + r.w * (from + width), r.y])
      .line([r.x + r.w * (from + width - 0.4), r.y + r.h])
      .line([r.x + r.w * (from - 0.4), r.y + r.h])
      .close();
    c.fill(band(0.58, 0.14), rgba(WHITE, 0.10));
    c.fill(band(0.76, 0.04), rgba(WHITE, 0.08));
    c.stroke(glass, rgba(BLACK, 0.28), g.frame * 0.5);
  });
  const m = g.mullion;
  const midX = g.glass.x + g.glass.w / 2, midY = g.glass.y + g.glass.h / 2;
  const bars = (dx, dy) => new Path().rect(midX - m / 2 + dx, g.glass.y + dy, m, g.glass.h).rect(g.glass.x + dx, midY - m / 2 + dy, g.glass.w, m);
  c.clip(glass, () => c.fill(bars(m * 0.3, m * 0.4), rgba(BLACK, 0.22)));
  c.fill(bars(0, 0), rgba(paint));
  const frame = new Path().rect(0, 0, w, g.sillTop.y).roundRect(g.glass.x, g.glass.y, g.glass.w, g.glass.h, g.radius);
  c.fill(frame, c.linear([[color('frame-light'), 1], [paint, 1], [color('frame-dark'), 1]], [0, 0], [0, g.sillTop.y]), 'evenodd');
  c.stroke(glass, rgba(color('frame-edge')), Math.max(1, g.frame * 0.08));
  c.fill(rect(g.sillTop.x, g.sillTop.y, g.sillTop.w, g.sillTop.h), rgba(color('sill-top')));
  const face = g.sillFace;
  c.fill(rect(face.x, face.y, face.w, face.h), c.linear([[color('sill-face-top'), 1], [color('sill-face-bottom'), 1]], [0, face.y], [0, face.y + face.h]));
  c.fill(rect(0, face.y, face.w, face.h * 0.22), c.linear([[BLACK, 0.16], [BLACK, 0]], [0, face.y], [0, face.y + face.h * 0.22]));
}

// ---- 조립 (WindowSceneComposer, WindowView, WindowCaption) ----

function composeLayers(s) {
  const providers = [...STANDARD_PROVIDERS, ...s.occasions.flatMap(id => OCCASIONS[id].decorations.map(key => DECORATIONS[key]))];
  const seen = new Set();
  const layers = providers.flatMap(provider => provider(s)).filter(layer => !seen.has(layer.id) && seen.add(layer.id));
  return layers.sort((a, b) => a.depth - b.depth);
}

function captionHTML(s, sizeKey, g, w) {
  const temperature = s.weather ? `${Math.round(s.weather.temperature)}°` : '--°';
  const occasion = s.occasions.length ? OCCASIONS[s.occasions[0]].name : null;
  const details = sizeKey === 'small' ? occasion : [s.region, occasion].filter(Boolean).join(' · ');
  const label = [s.region, s.time, s.weather && s.weather.condition, temperature, ...s.occasions.map(id => OCCASIONS[id].name)].filter(Boolean).join(', ');
  const items = details
    ? `<span class="time">${s.time}</span><span class="temp">${temperature}</span><span class="spacer"></span><span class="details">${details}</span>`
    : `<span class="time">${s.time}</span><span class="spacer"></span><span class="temp">${temperature}</span>`;
  const style = `top:${fx(g.sillFace.y)}px;width:${w}px;height:${fx(g.sillFace.h)}px;padding:0 ${fx(g.frame * 1.2)}px`;
  return `<div class="caption${sizeKey === 'large' ? ' large' : ''}" style="${style}" role="img" aria-label="${label}"><div class="caption-line">${items}</div></div>`;
}

function widgetHTML(scene, sizeKey) {
  const [w, h] = SIZES[sizeKey];
  const g = windowGeometry(w, h);
  const s = sceneContext(scene);
  const layers = composeLayers(s);
  const c = new Canvas();
  c.translate(g.glass.x, g.glass.y, () => {
    c.clip(new Path().roundRect(0, 0, g.glass.w, g.glass.h, g.radius), () => {
      layers.filter(l => !l.onFrame).forEach(l => l.draw(c, g.glass.w, g.glass.h));
    });
  });
  drawWindowFrame(c, g, w, h);
  layers.filter(l => l.onFrame).forEach(l => l.draw(c, w, h));
  return `<div class="widget ${sizeKey}" style="width:${w}px;height:${h}px">${c.svg(w, h)}${captionHTML(s, sizeKey, g, w)}</div>`;
}

document.getElementById('scenes').innerHTML = SCENES.map(scene => {
  const weather = scene.weather ? `${scene.weather[0]} · 기온 ${scene.weather[3]}°` : '날씨 없음';
  const meta = `${scene.region} ${scene.date} ${scene.time} · 해 ${scene.sun[0]}° · ${weather}`;
  const widgets = Object.keys(SIZES).map(size => widgetHTML(scene, size)).join('');
  return `<section class="scene"><h2>${scene.title}</h2><p class="meta">${meta}</p><div class="sizes">${widgets}</div></section>`;
}).join('');
</script>
