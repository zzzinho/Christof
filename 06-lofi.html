  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.5rem;
  }
  header p {
    margin: 0;
    color: var(--page-muted);
    font-size: 0.875rem;
  }
  main {
    display: grid;

    flex-wrap: wrap;
    align-items: flex-start;

  }
  .widget {
    background: var(--lofi-wood-dark);
  }
  main > h2 {
    margin: 0;
    font-size: 1.125rem;
  }
  .matrix {
    display: grid;
    grid-template-columns: 96px repeat(5, max-content);
    gap: 12px 16px;
    align-items: center;
  }
  .matrix .head {
    color: var(--page-muted);
    font-size: 0.8125rem;
  }
  .matrix .label {
    font-size: 0.875rem;
    font-weight: 600;
  }
  .matrix canvas {
    display: block;
    border-radius: 6px;
    image-rendering: pixelated;
  }

</header>

const rootStyle = getComputedStyle(document.documentElement);
const colorCache = {};
function color(name) {
  if (colorCache[name]) return colorCache[name];
  const value = rootStyle.getPropertyValue('--lofi-' + name).trim();
  if (!/^#[0-9a-f]{6}$/i.test(value)) throw new Error(`design.css 에 --lofi-${name} (#RRGGBB) 이 없다`);
  return (colorCache[name] = value);
}

// 시드 고정 난수 (Swift SeededRandom 과 같은 수열)
const MASK64 = (1n << 64n) - 1n;
class Rand {
  constructor(seed) { this.state = BigInt(seed); }
  next() {
    this.state = (this.state + 0x9E3779B97F4A7C15n) & MASK64;
    let z = this.state;
    z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & MASK64;
    z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & MASK64;
    return z ^ (z >> 31n);
  }
  below(bound) {
    let m = this.next() * bound;
    if ((m & MASK64) < bound) {
      const t = ((1n << 64n) - bound) % bound;
      while ((m & MASK64) < t) m = this.next() * bound;
    }
    return m >> 64n;
  }
  range(lower, upper) {
    const max = 1n << 53n;
    const r = this.below(max + 1n);
    if (r === max) return upper;
    return (upper - lower) * (Number(r) * (Number.EPSILON / 2)) + lower;
  }
  int(lower, upper) { return Math.floor(this.range(lower, upper + 0.999)); }
}

const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bayer = (x, y) => (BAYER[((y % 4) + 4) % 4][((x % 4) + 4) % 4] + 0.5) / 16;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const pt = v => v / DOT;
// f(0~1) 만큼 a 에서 b 로 넘어가는 자리. 띠 경계 30% 만 섞는다.
const blend = (a, b, f, x, y) => (clamp((f - 0.5) / 0.3 + 0.5, 0, 1) > bayer(x, y) ? b : a);

class Grid {
  constructor(cols, rows) {
    this.cols = cols;
    this.rows = rows;
    this.cells = new Array(cols * rows).fill(null);
    this.ox = 0;
    this.oy = 0;
    this.bounds = [0, 0, cols, rows];
  }
  set(x, y, c) {
    if (!c) return;
    const ax = Math.floor(x) + this.ox, ay = Math.floor(y) + this.oy;
    const [x0, y0, x1, y1] = this.bounds;
    if (ax < x0 || ay < y0 || ax >= x1 || ay >= y1) return;
    this.cells[ay * this.cols + ax] = c;
  }
  within(x, y, w, h, draw) {
    const saved = [this.ox, this.oy, this.bounds];
    const [x0, y0, x1, y1] = this.bounds;
    this.ox += x;
    this.oy += y;
    this.bounds = [Math.max(x0, this.ox), Math.max(y0, this.oy), Math.min(x1, this.ox + w), Math.min(y1, this.oy + h)];
    draw();
    [this.ox, this.oy, this.bounds] = saved;
  }
  rect(x, y, w, h, c) {
    for (let j = Math.round(y); j < Math.round(y + h); j++) for (let i = Math.round(x); i < Math.round(x + w); i++) this.set(i, j, c);
  }
  shape(x0, y0, x1, y1, inside, c) {
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
        if (inside(x + 0.5, y + 0.5)) this.set(x, y, typeof c === 'function' ? c(x, y) : c);
      }
    }
  }
  // rows: 문자열 줄 목록, map: 글자 → 색 이름. 아래 가운데를 (x, bottom) 에 맞춘다.
  sprite(x, bottom, rows, map) {
    const left = Math.round(x - rows[0].length / 2), top = bottom - rows.length;
    rows.forEach((row, j) => [...row].forEach((ch, i) => { if (map[ch]) this.set(left + i, top + j, color(map[ch])); }));
  }
  canvas() {
    const canvas = document.createElement('canvas');
    canvas.width = this.cols;
    canvas.height = this.rows;
    const ctx = canvas.getContext('2d');
    this.cells.forEach((c, i) => {
      if (!c) return;
      ctx.fillStyle = c;
      ctx.fillRect(i % this.cols, Math.floor(i / this.cols), 1, 1);
    });
    return canvas;
  }
}

function disc(g, cx, cy, r, c) {
  g.shape(cx - r, cy - r, cx + r, cy + r, (x, y) => Math.hypot(x - cx, y - cy) <= r, c);
}

// 원 바깥 thickness 칸을 바깥으로 갈수록 성기게 찍는 빛 번짐
function ring(g, cx, cy, r, thickness, c) {
  const dist = (x, y) => Math.hypot(x - cx, y - cy);
  g.shape(cx - r - thickness, cy - r - thickness, cx + r + thickness, cy + r + thickness,
    (x, y) => dist(x, y) > r && dist(x, y) <= r + thickness,
    (x, y) => ((1 - (dist(x + 0.5, y + 0.5) - r) / (thickness + 0.5)) * 0.75 > bayer(x, y) ? c : null));
}

const CLOUD_DECK = new Set(['overcast', 'drizzle', 'rain', 'snow', 'thunderstorm']);
const RAIN = new Set(['drizzle', 'rain', 'thunderstorm']);
const STARS = new Set(['clear', 'partlyCloudy']);
const COMPONENTS = ['window', 'person', 'cat', 'room', 'clock'];

// 창은 남쪽을 바라본다. 결과는 유리 기준 0~1 좌표.
function celestialPoint(altitude, azimuth) {
  if (altitude <= -2) return null;
  const d = ((azimuth % 360) + 360) % 360 - 180;
  const base = 0.72 - 0.035;
  return [clamp(0.5 + d / 135 * 0.45, 0.05, 0.95), base - Math.pow(clamp(altitude, 0, 75) / 75, 0.75) * (base - 0.1)];
}

function sceneContext(scene) {
  const weather = scene.weather && {
    condition: scene.weather[0], intensity: scene.weather[1], cloudCover: scene.weather[2], temperature: scene.weather[3],
  };
  const [sunAltitude, sunAzimuth] = scene.sun;
  const gloomy = !!weather && (CLOUD_DECK.has(weather.condition) || weather.condition === 'fog');
  // 흐린 날은 해 질 녘도 회색 하늘로 둔다. 비·눈·안개 색은 night 와 grey 에만 있다.
  const phase = sunAltitude < -6 ? 'night' : gloomy ? 'grey' : sunAltitude < 6 ? 'dusk' : 'day';
  return {
    ...scene,
    weather,
    phase,
    lightOn: phase !== 'day',
    minute: Number(scene.time.split(':')[1]),
    // 구성 요소마다 진행 중인 이벤트들이 고른 모양 이름
    looks: Object.fromEntries(COMPONENTS.map(part => [part, [...new Set(scene.occasions.flatMap(id => [].concat(OCCASIONS[id].looks[part] ?? [])))]])),
    sunPoint: gloomy ? null : celestialPoint(sunAltitude, sunAzimuth),
    moonPoint: gloomy || sunAltitude >= 0 ? null : celestialPoint(scene.moon[1], scene.moon[2]),
    // 따뜻한 겨울(부산·제주)은 마른 풍경으로 두고, 눈이 오거나 영하일 때만 지붕에 눈을 얹는다.
    snowCovered: !!weather && (weather.condition === 'snow' || (scene.season === 'winter' && weather.temperature <= 0)),
  };
}

// 구성 요소 자리. 크기마다 따로 계산한다. boxes 는 구성 요소 비교표에서 잘라 보일 영역이다.
function layout(W, H, s) {
  const wide = W > H, deskTop = H - 7, sill = deskTop - 2;
  const x0 = Math.round(W * (wide ? 0.06 : 0.04)), x1 = x0 + Math.round(W * (wide ? 0.5 : 0.6));
  const y0 = Math.round(H * 0.1);
  const tree = s.looks.room.some(name => ROOM_LOOKS[name].light === 'tree');
  const treeX = W - 9, lampX = Math.round(W * (wide ? 0.92 : 0.95));
  const personX = Math.round(W * (wide ? (tree ? 0.72 : 0.74) : (tree ? 0.6 : 0.72)));
  const clock = [x1 + 7, y0 + 4], cat = [x0 + 9, sill];
  return {
    W, H, deskTop, sill, x0, x1, y0, tree, treeX, lampX, personX, clock, cat,
    view: [x0 + 2, y0 + 2, x1 - x0 - 4, sill - y0 - 2],
    light: tree ? [treeX, H - 20] : [lampX - 2, deskTop - 9],
    boxes: {
      window: [x0 - 5, y0 - 3, x1 + 3, sill + 2],
      person: [personX - 10, H - 31, personX + 10, H],
      cat: [cat[0] - 9, sill - 16, cat[0] + 12, sill + 2],
      room: [0, 0, W, H],
      clock: [clock[0] - 11, clock[1] - 11, clock[0] + 12, clock[1] + 17],
    },
  };
}

  ],
  witchHat: [
    '..........WW....',
    '.........WWW....',
    '........WWWW....',
    '.......WWWWWW...',
    '......WWWWWWW...',
    '......WbbbbbW...',
    'WWWWWWWWWWWWWWWW',
  ],
  beanie: [
    '.......ww.......',
    '......wwww......',
    '.....BBBBBB.....',
    '....BBBBBBBB....',
    '...BBBBBBBBBB...',
    '..bbbbbbbbbbbb..',
  ],
  scarf: [
    '.....ffffff.....',
    '...ffffffffff...',
    '..........ff....',
    '..........ff....',
  ],
  // 고양이 위에 겹치는 모양. 폭 11 이라 고양이와 왼쪽 끝이 같다.
  catPouch: ['..PPPPP....', '...pgp.....', '...ppp.....'],
  catBeanie: ['...w.......', '...BB......', '..BBBB.....'],
  catLotus: ['...P.......', '..PpP......'],
  catScarf: ['..SSSSS....', '..S........', '..S........', '.S.........'],
  pumpkin: [
    '....s....',
    '.ooosooo.',
    'oOYoooYOo',

    'oOooYooOo',
    'oOYYYYYOo',
    '.ooooooo.',
  ],
  lotusBowl: ['.P.P.', 'PpPpP', 'lllll', '.BBB.'],
  tteokguk: ['.t.t.', 'cgccc', 'BBBBB', '.BBB.'],
  bureom: ['.nNn.', 'NnNnN', 'BBBBB', '.BBB.'],
  songpyeon: ['.pWg.', 'pWgWp', 'MMMMM'],
  cards: ['P..W.', 'PP.WW', 'PP.WW'],
  kite: ['PPPPP', 'WWWWW', 'WW.WW', 'WWWWW', 'WWWWW'],
  bat: ['WW.WW', '.WWW.', '..W..'],
  fire: ['..Y..', '.YYY.', '.YOY.', 'YOOOY', 'OOOOO', 'bbbbb'],
};
const SPRITE_COLORS = {
  h: 'hair', H: 'hair-rim', k: 'headphone', K: 'headphone-accent', s: 'skin', S: 'hoodie-rim',
  o: 'hoodie', d: 'hoodie-dark', r: 'hoodie-rim', c: 'cat', R: 'cat-rim',
  L: 'lamp', b: 'lamp-body', Y: 'lamp-light', m: 'mug-dark', M: 'mug', t: 'steam',
  1: 'book-1', 2: 'book-2', 3: 'book-3', l: 'plant', p: 'pot',
};
// 불을 끈 낮에는 테두리 빛 자리를 바탕색으로 칠한다.
const UNLIT_COLORS = { ...SPRITE_COLORS, H: 'hair', S: 'skin', r: 'hoodie', R: 'cat', Y: 'lamp' };

// ---- 조립 ----
// 쌓는 순서: 벽 → 시계 → 창문(창밖·창틀·커튼) → 고양이 → 방 안 물건 → 사람

function compose(g, W, H, s) {
  const L = layout(W, H, s);
  drawWall(g, L, s);
  drawClock(g, L, s);
  drawWindow(g, L, s);
  drawCat(g, L, s);
  drawRoom(g, L, s);
  drawPerson(g, L, s);
  return L;
}

// ---- 구성 요소 1: 창문 ----
// 이벤트 모양은 그리는 깊이로 나눈다: sky(해·달 뒤, 도시 앞), ground(도시·가로수 앞), glass(날씨 앞, 유리 위), frame(창틀 위).

const WINDOW_LOOKS = {
  // 설날: 하늘에 뜬 방패연
  kite: { sky(g, w, h) {
    const x = Math.round(w * 0.72), y = Math.round(h * 0.16);
    g.sprite(x, y + 5, SPRITES.kite, { P: 'pouch', W: 'hanbok-collar' });
    for (let k = 0; k < 5; k++) for (const dx of [-2, 2]) g.set(x + dx - Math.floor(k / 2), y + 5 + k, color('pouch-knot'));
  } },
  // 새해 첫날: 첫 해 둘레의 따뜻한 빛
  sunGlow: { sky(g, w, h, s) {
    if (!s.sunPoint) return;
    const [cx, cy, r] = sunCircle(s, w, h);
    ring(g, cx, cy, r + 2, 3, color('moon-glow-1'));
    ring(g, cx, cy, r, 2, color('sun-low'));
  } },
  // 정월대보름·추석: 보름달 둘레의 따뜻한 빛 두 겹
  moonHalo: { sky(g, w, h, s) {
    if (!s.moonPoint) return;
    const [cx, cy, r] = moonCircle(s, w, h);
    ring(g, cx, cy, r + 2, 3, color('moon-glow-2'));
    ring(g, cx, cy, r, 2, color('moon-glow-1'));
  } },
  // 정월대보름: 멀리 달집 태우는 불
  daljip: { ground(g, w, h) {
    const x = Math.round(w * 0.62);
    ring(g, x + 0.5, h - 3, 0, 5, color('moon-glow-1'));
    g.sprite(x, h, SPRITES.fire, { Y: 'lamp-light', O: 'lamp', b: 'branch' });
  } },
  // 추석: 창 왼쪽 위로 들어온 감나무 가지
  persimmonBranch: { ground(g, w) {
    const end = Math.round(w * 0.35), y = x => 1 + Math.round(x * 0.25);
    for (let x = 0; x < end; x++) g.set(x, y(x), color('branch'));
    for (const t of [0.3, 0.6, 0.9]) {
      const x = Math.round(end * t);
      g.set(x + 1, y(x) - 1, color('plant-dark'));
      g.rect(x - 1, y(x) + 1, 2, 2, color('autumn-1'));
    }
  } },
  // 할로윈: 하늘의 박쥐
  bats: { sky(g, w, h) {
    for (const [fx, fy] of [[0.2, 0.22], [0.5, 0.12], [0.72, 0.3]]) g.sprite(Math.round(w * fx), Math.round(h * fy) + 3, SPRITES.bat, { W: 'cat' });
  } },
  // 크리스마스: 유리 모서리와 아래쪽에 낀 성에
  frost: { glass(g, w, h) {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const corner = Math.min(Math.hypot(x, y), Math.hypot(w - 1 - x, y), Math.hypot(x, h - 1 - y), Math.hypot(w - 1 - x, h - 1 - y));
        if (Math.max(1 - corner / 7, 1 - (h - 1 - y) / 3) * 0.85 > bayer(x, y)) g.set(x, y, color('frost'));
      }
    }
  } },
  // 부처님오신날: 창 위에 건 연등 줄
  lanterns: { frame(g, L, s) { drawLanterns(g, L.x0, L.x1, L.y0 - 1, s.lightOn); } },
};

function drawWindow(g, L, s) {
  const { x0, x1, y0, sill } = L, [vx, vy, vw, vh] = L.view;
  const looks = s.looks.window.map(name => WINDOW_LOOKS[name]);
  g.within(vx, vy, vw, vh, () => drawView(g, vw, vh, s, looks));
  for (let y = y0; y < sill; y++) {
    for (let x = x0; x < x1; x++) {
      if (x >= x0 + 2 && x < x1 - 2 && y >= y0 + 2) continue;
      g.set(x, y, color(y === y0 ? 'wood-light' : 'wood'));
    }
  }
  const midX = Math.round((x0 + x1) / 2), midY = Math.round(y0 + (sill - y0) * 0.42);
  g.rect(midX, y0 + 2, 1, sill - y0 - 2, color('wood'));
  g.rect(x0 + 2, midY, x1 - x0 - 4, 1, color('wood'));
  g.rect(x0 - 2, sill, x1 - x0 + 4, 2, color('wood-light'));
  // 왼쪽 얇은 커튼
  for (let y = y0 - 2; y < L.deskTop; y++) {
    const right = x0 + 3 + Math.round(Math.sin(y * 0.4) * 0.7 + (y > L.H * 0.5 ? 1 : 0));
    for (let x = Math.max(0, x0 - 4); x < right; x++) g.set(x, y, color((x + 1) % 3 === 0 ? 'curtain-dark' : 'curtain'));
  }
  for (const look of looks) look.frame?.(g, L, s);
}

// 창밖. 좌표는 유리 기준 칸이다.
function drawView(g, w, h, s, looks) {
  const bands = [1, 2, 3, 4].map(i => pc(s, `sky-${i}`));
  for (let y = 0; y < h; y++) {
    const t = clamp((y + 0.5) / (h * 0.8), 0, 1) * (bands.length - 1);
    const i = Math.min(bands.length - 2, Math.floor(t));
    for (let x = 0; x < w; x++) g.set(x, y, blend(bands[i], bands[i + 1], t - i, x, y));
  }
  if (s.phase === 'night' && (!s.weather || STARS.has(s.weather.condition))) drawStars(g, w, h);
  // 조각구름이 달을 가리면 보름달도 초승달처럼 보여서, 해·달을 구름 앞에 그린다. 구름층이 덮는 날은 해·달을 그리지 않는다.
  if (s.weather) drawClouds(g, w, h, s);
  if (s.sunPoint) drawSun(g, w, h, s);
  if (s.moonPoint) drawMoon(g, w, h, s);
  for (const look of looks) look.sky?.(g, w, h, s);
  if (s.weather?.condition === 'thunderstorm') drawLightning(g, w, h, s);
  drawCity(g, w, h, s);
  drawStreetTrees(g, w, h, s);
  for (const look of looks) look.ground?.(g, w, h, s);
  if (s.weather && RAIN.has(s.weather.condition)) drawRain(g, w, h, s);
  if (s.weather?.condition === 'snow') drawSnow(g, w, h, s);
  if (s.weather?.condition === 'fog') drawFog(g, w, h, s);
  for (const look of looks) look.glass?.(g, w, h, s);
}

function drawStars(g, w, h) {
  const stars = new Rand(3);
  const count = Math.round(w * h * DOT * DOT * 0.001);
  for (let i = 0; i < count; i++) {
    g.set(Math.floor(stars.range(0, 1) * w), Math.floor(stars.range(0, 0.55) * h), color(stars.range(0, 1) < 0.3 ? 'star' : 'star-dim'));
  }
}

const bodyCircle = (point, w, h, radius) => [Math.floor(point[0] * w) + 0.5, Math.floor(point[1] * h) + 0.5, pt(radius) + 0.3];
const sunCircle = (s, w, h) => bodyCircle(s.sunPoint, w, h, 9);
const moonCircle = (s, w, h) => bodyCircle(s.moonPoint, w, h, 10);

function drawSun(g, w, h, s) {
  const [cx, cy, r] = sunCircle(s, w, h);
  ring(g, cx, cy, r, 2, pc(s, 'sky-4'));
  disc(g, cx, cy, r, color(s.sun[0] < 10 ? 'sun-low' : 'sun-high'));
}

function drawMoon(g, w, h, s) {
  const [cx, cy, r] = moonCircle(s, w, h);
  ring(g, cx, cy, r, 2, color('halo'));
  // 차는 달(위상 < 0.5)은 오른쪽이 밝다. 밝은 면 경계는 x 반지름이 cos(2π·위상)인 반타원.
  const phase = s.moon[0], k = Math.cos(phase * 2 * Math.PI);
  disc(g, cx, cy, r, (x, y) => {
    const dy = y + 0.5 - cy, half = Math.sqrt(Math.max(0, r * r - dy * dy));
    const u = half ? (x + 0.5 - cx) / half : 0;
    return color((phase < 0.5 ? u >= k : u <= -k) ? 'moon' : 'halo');
  });
}

function drawClouds(g, w, h, s) {
  const light = pc(s, 'cloud'), dark = pc(s, 'cloud-dark');
  if (CLOUD_DECK.has(s.weather.condition)) {
    // 하늘 위쪽을 덮고 아래로 갈수록 성겨지는 구름층
    const depth = h * 0.55;
    for (let y = 0; y < depth; y++) {
      const t = y / depth;
      for (let x = 0; x < w; x++) if ((1 - t) * 1.5 > bayer(x, y)) g.set(x, y, t < 0.5 ? light : dark);
    }
  }
  const random = new Rand(5);
  const count = Math.round(s.weather.cloudCover * 5);
  for (let i = 0; i < count; i++) {
    const cx = random.range(-0.05, 1.05) * w, cy = random.range(0.1, 0.4) * h, size = random.range(3, 5);
    const puffs = [[-size, 0, size * 0.7], [0, -size * 0.4, size], [size, 0, size * 0.75]];
    g.shape(cx - size * 2, cy - size * 1.5, cx + size * 2, cy + size,
      (x, y) => y <= cy + size * 0.5 && puffs.some(([dx, dy, r]) => Math.hypot(x - cx - dx, y - cy - dy) <= r),
      (x, y) => (y + 0.5 > cy + size * 0.1 ? dark : light));
  }
}

function drawLightning(g, w, h, s) {
  const random = new Rand(101 + s.hour);
  let x = Math.round(random.range(0.25, 0.75) * w), y = Math.round(h * 0.15);
  // 번개가 시작하는 구름 속만 밝힌다. 하늘 전체를 밝히면 뇌우가 비보다 밝아 보인다.
  ring(g, x + 0.5, y + 0.5, 0, pt(15), color('bolt-glow'));
  while (y < h * 0.7) {
    const step = random.int(2, 4);
    for (let i = 0; i < step; i++) g.set(x, y++, color('bolt'));
    x += random.int(-1, 1);
  }
}

// 먼 도시와 가까운 지붕들. 해가 진 뒤와 흐린 날은 창에 호박색 불이 켜진다.
function drawCity(g, w, h, s) {
  const city = new Rand(7);
  const lit = s.phase === 'day' ? 0 : s.phase === 'grey' ? 0.4 : 1;
  for (const [layer, bottomF, minH, maxH, density] of [['city-far', 0.86, 14, 30, 0.12], ['city', 0.95, 8, 20, 0.25]]) {
    let x = city.range(-3, 0);
    while (x < w) {
      const bw = city.int(Math.round(pt(14)), Math.round(pt(30)));
      const bh = Math.round(pt(city.range(minH, maxH)) + h * 0.08);
      const bottom = Math.round(h * bottomF), top = bottom - bh;
      g.rect(x, top, bw, h - top, pc(s, layer));
      if (layer === 'city' && s.snowCovered) g.rect(x, top, bw, 1, pc(s, 'snow'));
      for (let wy = top + 2; wy < h; wy += 2) {
        for (let wx = Math.round(x) + 1; wx < x + bw - 1; wx += 2) if (city.range(0, 1) < density * lit) g.set(wx, wy, color('window-lit'));
      }
      x += bw + city.int(0, 2);
    }
  }
}

const CROWNS = { spring: ['spring-1', 'spring-2'], summer: ['summer-1', 'summer-2'], autumn: ['autumn-1', 'autumn-2', 'autumn-3'] };

// 창 아래쪽 가로수로 계절을 보인다. 해가 진 뒤에는 실루엣이고, 겨울은 잎 없는 가지다.
function drawStreetTrees(g, w, h, s) {
  const random = new Rand(13);
  const dark = s.phase === 'night' || s.phase === 'dusk';
  const crowns = CROWNS[s.season];
  const bark = dark ? pc(s, 'city') : color('branch');
  for (let x = random.range(1, 4), i = 0; x < w + 4; i++) {
    const r = random.range(3, 4.6), cx = Math.round(x), top = h - random.int(7, 10);
    g.rect(cx, top, 1, h - top, bark);
    if (crowns) {
      const main = dark ? bark : color(crowns[i % 3 === 2 && crowns[2] ? 2 : 0]);
      const shade = dark ? bark : color(crowns[1]);
      g.shape(cx - r, top - r, cx + r + 1, top + r, (px, py) => Math.hypot(px - cx - 0.5, py - top) <= r,
        (px, py) => (px - cx + py - top > r * 0.6 ? shade : main));
    } else {
      for (let k = 1; k <= 3; k++) {
        g.set(cx - k, top + 3 - k, bark);
        g.set(cx + k, top + 4 - k, bark);
      }
      g.rect(cx, top - 3, 1, 3, bark);
    }
    x += r * 2 + random.range(1, 4);
  }
}

function drawRain(g, w, h, s) {
  const drizzle = s.weather.condition === 'drizzle';
  const count = Math.round(w * h * (drizzle ? 0.012 : 0.02) * (0.5 + s.weather.intensity));
  const length = drizzle ? 2 : 3, random = new Rand(17);
  for (let i = 0; i < count; i++) {
    const x = Math.floor(random.range(0, w + 2)), y = Math.floor(random.range(-2, h));
    for (let k = 0; k < length; k++) g.set(x - Math.floor(k / 2), y + k, pc(s, 'rain'));
  }
}

function drawSnow(g, w, h, s) {
  const count = Math.round(w * h * 0.02 * (0.5 + s.weather.intensity)), random = new Rand(23);
  for (let i = 0; i < count; i++) g.set(Math.floor(random.range(0, w)), Math.floor(random.range(0, h)), pc(s, 'snow'));
}

function drawFog(g, w, h, s) {
  const density = 0.45 + 0.4 * s.weather.intensity;
  for (let y = 0; y < h; y++) {
    const f = density * (0.35 + 0.65 * y / h);
    for (let x = 0; x < w; x++) if (f > bayer(x, y)) g.set(x, y, pc(s, 'fog'));
  }
}

// 창 위에 건 연등 줄. 해가 진 뒤에는 연등 속이 밝다.
function drawLanterns(g, left, right, y, lit) {
  const sag = x => y + Math.round(Math.sin((x - left) / (right - left) * Math.PI) * 3);
  for (let x = left; x <= right; x++) g.set(x, sag(x), color('wire'));
  const n = Math.max(3, Math.round((right - left) / pt(28)));
  for (let i = 0; i < n; i++) {
    const bx = Math.round(left + (right - left) * (i + 0.5) / n), shade = `bulb-${i % 4 + 1}`;
    g.set(bx, sag(bx) + 1, color('wire'));
    g.sprite(bx, sag(bx) + 2 + SPRITES.lantern.length, SPRITES.lantern, { p: shade, P: lit ? 'lamp-light' : shade, l: 'plant' });
  }
}

// ---- 구성 요소 2: 사람 ----
// 이벤트 모양은 기본 사람 위에 겹쳐 그린다. (x: 가운데, top: 사람 맨 윗줄)

const PERSON_LOOKS = {
  hanbok: (g, x, top) => dressHanbok(g, x, top, 'hanbok', true),
  hanbokPlain: (g, x, top) => dressHanbok(g, x, top, 'hanbok-jade', false),
  beanie(g, x, top) {
    g.sprite(x, top + 5, SPRITES.beanie, { w: 'santa-trim', B: 'beanie', b: 'beanie-dark' });
    g.sprite(x, top + 17, SPRITES.scarf, { f: 'scarf' });
  },
  moonPin: (g, x, top) => g.rect(x + 2, top + 1, 2, 2, color('moon')),
  lotusPin: (g, x, top) => g.sprite(x + 3, top + 3, ['.P', 'PP', 'pP'], { P: 'spring-1', p: 'spring-2' }),
  witchHat: (g, x, top) => g.sprite(x, top + 5, SPRITES.witchHat, { W: 'witch', b: 'pumpkin' }),
  santaHat: (g, x, top) => g.sprite(x, top + 5, SPRITES.santaHat, { R: 'santa', w: 'santa-trim' }),
};

// 후드 자리를 저고리로 다시 칠한다. 색동은 양쪽 소매 세 칸에 줄마다 다른 색이다.
function dressHanbok(g, x, top, body, saekdong) {
  const rows = SPRITES.person, left = x - rows[0].length / 2;
  const stripes = ['pouch', 'pouch-gold', 'summer-1', 'pouch-knot', 'hanbok'];
  for (let j = 14; j < rows.length; j++) {
    [...rows[j]].forEach((ch, i) => {
      if (ch === '.') return;
      const name = j === 14 ? 'hanbok-collar' : saekdong && (i <= 2 || i >= 13) ? stripes[j % stripes.length] : body;
      g.set(left + i, top + j, color(name));
    });
  }
  // 댕기
  for (const [i, j] of [[9, 1], [10, 1], [10, 2], [11, 3]]) g.set(left + i, top + j, color('pouch'));
}

// 사람은 책상 앞(카메라 쪽)에 앉아 창을 바라본다. 허리 아래는 위젯 아래 끝에서 잘린다.
function drawPerson(g, L, s) {
  g.sprite(L.personX, L.H, SPRITES.person, s.lightOn ? SPRITE_COLORS : UNLIT_COLORS);
  const top = L.H - SPRITES.person.length;
  for (const name of s.looks.person) PERSON_LOOKS[name](g, L.personX, top, s);
}

// ---- 구성 요소 3: 고양이 ----
// 창턱에 앉은 뒷모습. 이벤트 모양은 고양이 위에 겹치거나 옆에 둔다. (x: 가운데, top: 고양이 맨 윗줄)

const CAT_LOOKS = {
  pouch: (g, x, top) => g.sprite(x, top + 8, SPRITES.catPouch, { P: 'pouch', p: 'pouch-light', g: 'pouch-gold' }),
  beanie: (g, x, top) => g.sprite(x, top + 2, SPRITES.catBeanie, { w: 'santa-trim', B: 'beanie' }),
  walnut: (g, x, top) => g.sprite(x + 8, top + 12, ['nNn', 'NnN'], { n: 'wood-light', N: 'branch' }),
  lotus: (g, x, top) => g.sprite(x, top + 1, SPRITES.catLotus, { P: 'spring-1', p: 'spring-2' }),
  persimmon: (g, x, top) => g.sprite(x + 8, top + 12, ['.l.', 'ooo', 'ooo'], { l: 'plant-dark', o: 'autumn-1' }),
  batWings(g, x, top) {
    const left = x - 5;
    for (const [dx, dy] of [[1, 6], [2, 5], [3, 4], [4, 4], [1, 7], [2, 6], [3, 5], [2, 7], [1, 8]]) {
      g.set(left - dx, top + dy, color('hoodie-dark'));
      g.set(left + 8 + dx, top + dy, color('hoodie-dark'));
    }
  },
  scarf: (g, x, top) => g.sprite(x, top + 9, SPRITES.catScarf, { S: 'santa' }),
};

function drawCat(g, L, s) {
  const [x, bottom] = L.cat;
  g.sprite(x, bottom, SPRITES.cat, s.lightOn ? SPRITE_COLORS : UNLIT_COLORS);
  for (const name of s.looks.cat) CAT_LOOKS[name](g, x, bottom - SPRITES.cat.length, s);
}

// ---- 구성 요소 4: 방 안 ----
// 이벤트 모양은 자리를 바꾸거나(sill: 창턱 화분 자리, light: 스탠드 자리) 더한다(desk: 책상 위, draw: 그 밖).

const ROOM_LOOKS = {
  tteokguk: { desk: (g, x, y) => g.sprite(x, y, SPRITES.tteokguk, { t: 'steam', c: 'hanbok-collar', g: 'summer-1', B: 'pouch-knot' }) },
  greetingCards: { desk: (g, x, y) => g.sprite(x, y, SPRITES.cards, { P: 'pouch', W: 'hanbok-collar' }) },
  bureom: { desk: (g, x, y) => g.sprite(x, y, SPRITES.bureom, { n: 'wood-light', N: 'branch', B: 'mug-dark' }) },
  songpyeon: { desk: (g, x, y) => g.sprite(x, y, SPRITES.songpyeon, { p: 'hanbok', W: 'hanbok-collar', g: 'summer-1', M: 'mug' }) },
  lotusBowl: { sill: (g, x, y) => g.sprite(x, y, SPRITES.lotusBowl, { P: 'spring-1', p: 'spring-2', l: 'plant', B: 'pouch-knot' }) },
  pumpkin: {
    sill: (g, x, y, s) => g.sprite(x - 1, y, SPRITES.pumpkin, { s: 'plant-dark', o: 'pumpkin', O: 'pumpkin-dark', Y: s.lightOn ? 'lamp-light' : 'pumpkin-dark' }),
    draw: (g, L) => drawCobweb(g, L.W),
  },
  tree: { light: 'tree', draw: (g, L) => drawGifts(g, L) },
};

function drawWall(g, L, s) {
  // 불을 켰으면 불빛에서 멀어질수록 차가운 색. 거친 질감은 성긴 어두운 점.
  const grain = new Rand(41);
  const reach = pt(L.W > L.H ? 110 : 90);
  for (let y = 0; y < L.H; y++) {
    for (let x = 0; x < L.W; x++) {
      let c = pc(s, 'wall');
      if (s.lightOn) {
        const d = Math.hypot(x + 0.5 - L.light[0], (y + 0.5 - L.light[1]) * 1.2) / reach;
        if (d < 0.35) c = blend(pc(s, 'wall-warmer'), pc(s, 'wall-warm'), d / 0.35, x, y);
        else if (d < 0.75) c = blend(pc(s, 'wall-warm'), c, (d - 0.35) / 0.4, x, y);
      }
      if (grain.range(0, 1) < 0.04) c = pc(s, 'wall-dark');
      g.set(x, y, c);
    }
  }
}

function drawRoom(g, L, s) {
  const looks = s.looks.room.map(name => ROOM_LOOKS[name]);
  const colors = s.lightOn ? SPRITE_COLORS : UNLIT_COLORS;
  const sillLook = looks.find(look => look.sill);
  if (sillLook) sillLook.sill(g, L.x1 - 7, L.sill, s);
  else g.sprite(L.x1 - 6, L.sill, SPRITES.plant, colors);

  if (L.H > 80) drawShelf(g, L.x1 + 6, L.W - 6, Math.round(L.H * 0.38));

  // 책상: 윗면은 불빛(낮에는 창) 가까울수록 밝다. 트리가 있으면 그 앞에서 끝난다.
  const deskRight = L.tree ? L.treeX - 11 : L.W;
  const litX = s.lightOn ? L.light[0] : (L.x0 + L.x1) / 2;
  for (let x = 0; x < deskRight; x++) {
    g.set(x, L.deskTop, blend(color('desk-lit'), color('wood-light'), Math.abs(x - litX) / (L.W * 0.5), x, L.deskTop));
  }
  g.rect(0, L.deskTop + 1, deskRight, L.H - L.deskTop - 1, color('wood'));
  g.sprite(L.personX - pt(42), L.deskTop + 1, SPRITES.books, colors);
  g.sprite(L.personX - pt(24), L.deskTop + 1, SPRITES.mug, colors);
  for (const look of looks) look.desk?.(g, L.personX - 23, L.deskTop + 1, s);

  if (L.tree) drawTree(g, L.treeX, L.H);
  else g.sprite(L.lampX, L.deskTop + 1, SPRITES.lamp, colors);
  for (const look of looks) look.draw?.(g, L, s);
}

// 방 구석의 트리. 크기와 관계없이 높이 40칸이다. 층마다 아래로 넓어지고, 층 아래 끝과 왼쪽은 그늘이다.
function drawTree(g, cx, bottom) {
  const top = bottom - 40, rows = 37;
  const halfAt = r => {
    const tier = Math.min(2, Math.floor(r / 12));
    return Math.round(1 + tier * 2 + (r - tier * 12) * 0.45);
  };
  for (let r = 0; r < rows; r++) {
    const half = halfAt(r), tierEnd = r % 12 === 11 || r === rows - 1;
    for (let x = cx - half; x <= cx + half; x++) g.set(x, top + r, color(tierEnd || x < cx - half / 3 ? 'tree-dark' : 'tree'));
  }
  const lights = new Rand(23), palette = ['bulb-1', 'bulb-2', 'bulb-3', 'bulb-4', 'lamp-light'];
  for (let i = 0; i < 18; i++) {
    const r = lights.int(3, rows - 2), half = halfAt(r);
    g.set(cx + Math.round(lights.range(-0.8, 0.8) * half), top + r, color(palette[lights.int(0, palette.length - 1)]));
  }
  g.rect(cx, top - 2, 1, 3, color('lamp-light'));
  g.rect(cx - 1, top - 1, 3, 1, color('lamp-light'));
  g.rect(cx - 3, top + rows, 7, bottom - top - rows, color('pot'));
}

function drawGifts(g, L) {
  g.sprite(L.treeX - 7, L.H, ['RRgRR', 'RRgRR', 'ggggg', 'RRgRR'], { R: 'santa', g: 'pouch-gold' });
  g.sprite(L.treeX + 6, L.H, ['GGrG', 'rrrr', 'GGrG'], { G: 'summer-1', r: 'santa-trim' });
}

// 방 오른쪽 위 구석의 거미줄: 구석에서 뻗는 줄 셋과 둥근 줄 셋
function drawCobweb(g, W) {
  const cx = W - 0.5, cy = 0, c = color('star-dim');
  const at = (deg, r) => [cx + Math.cos(deg * Math.PI / 180) * r, cy + Math.sin(deg * Math.PI / 180) * r];
  for (const deg of [100, 135, 170]) for (let r = 0; r <= 7; r += 0.5) g.set(...at(deg, r), c);
  for (const r of [2.5, 4.5, 7]) for (let deg = 95; deg <= 175; deg += 6) g.set(...at(deg, r), c);
}

// large 의 빈 벽에 둔 선반: 세워 둔 책과 늘어진 화분
function drawShelf(g, x0, x1, y) {
  g.rect(x0, y, x1 - x0, 1, color('wood-light'));
  g.rect(x0 + 1, y + 1, x1 - x0 - 2, 1, color('wood-dark'));
  const books = new Rand(19);
  for (let i = 0, x = x0 + 2; i < 6; i++, x += 2) {
    const h = books.int(5, 8);
    g.rect(x, y - h, 2, h, color(`book-${i % 3 + 1}`));
  }
  const px = x1 - 5;
  g.sprite(px, y, SPRITES.plant, SPRITE_COLORS);
  for (const [dx, len] of [[-2, 9], [0, 15], [2, 6]]) {
    for (let j = 0; j < len; j++) g.set(px + dx + (j % 4 === 3 ? 1 : 0), y + 2 + j, color(j % 2 ? 'plant-dark' : 'plant'));
  }
}

// ---- 구성 요소 5: 시계 ----
// 글자 대신 벽시계로 시각을 보인다. 이벤트 모양은 문자판 색(face)을 바꾸거나 둘레에 더한다(draw).

const CLOCK_LOOKS = {
  // 설날: 시계 아래 매듭 노리개
  norigae: { draw(g, cx, cy) {
    g.rect(cx, cy + 7, 1, 2, color('pouch'));
    g.rect(cx - 1, cy + 9, 3, 3, color('pouch'));
    g.set(cx, cy + 10, color('pouch-gold'));
    for (const dx of [-1, 0, 1]) g.rect(cx + dx, cy + 12, 1, 4 - Math.abs(dx), color('pouch'));
  } },
  // 새해 첫날: 시계 둘레 반짝이
  sparkles: { draw(g, cx, cy) {
    for (const [dx, dy] of [[-9, -5], [9, -3], [8, 8]]) {
      g.set(cx + dx, cy + dy, color('lamp-light'));
      for (const [ax, ay] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) g.set(cx + dx + ax, cy + dy + ay, color('star'));
    }
  } },
  // 정월대보름: 달빛 문자판
  moonFace: { face: 'moon' },
  // 부처님오신날: 시계 아래 작은 연등
  lantern: { draw(g, cx, cy, s) {
    g.rect(cx, cy + 7, 1, 2, color('wire'));
    g.sprite(cx, cy + 9 + SPRITES.lantern.length, SPRITES.lantern, { p: 'bulb-1', P: s.lightOn ? 'lamp-light' : 'bulb-1', l: 'plant' });
  } },
  // 추석: 달토끼 귀
  rabbitEars: { draw(g, cx, cy) {
    for (const x of [cx - 3, cx + 2]) {
      g.rect(x, cy - 10, 2, 4, color('hanbok-collar'));
      g.rect(x + (x < cx ? 1 : 0), cy - 9, 1, 2, color('hanbok'));
    }
  } },
  // 할로윈: 시계에 매달린 거미
  spider: { draw(g, cx, cy) {
    g.rect(cx + 4, cy + 5, 1, 6, color('star-dim'));
    g.sprite(cx + 4, cy + 14, ['W.W', '.W.', 'W.W'], { W: 'cat' });
  } },
  // 크리스마스: 시계 위 호랑가시 잎과 열매
  holly: { draw: (g, cx, cy) => g.sprite(cx, cy - 5, ['LL.LL', '.LrL.'], { L: 'summer-2', r: 'santa' }) },
};

// 13칸보다 작으면 시침과 분침이 한두 칸 차이라 구분되지 않는다. 시침은 두 칸 두께로 그린다.
function drawClock(g, L, s) {
  const [cx, cy] = L.clock;
  const looks = s.looks.clock.map(name => CLOCK_LOOKS[name]);
  disc(g, cx + 0.5, cy + 0.5, 6.5, color('clock-rim'));
  disc(g, cx + 0.5, cy + 0.5, 5.5, color(looks.find(look => look.face)?.face ?? 'clock-face'));
  for (const [dx, dy] of [[0, -5], [5, 0], [0, 5], [-5, 0]]) g.set(cx + dx, cy + dy, color('clock-rim'));
  const hand = (turns, length, width) => {
    const a = turns * 2 * Math.PI, [dx, dy] = [Math.sin(a), -Math.cos(a)];
    for (let t = 0; t <= length; t += 0.5) {
      for (let k = 0; k < width; k++) g.set(cx + Math.round(dx * t - dy * k * 0.7), cy + Math.round(dy * t + dx * k * 0.7), color('clock-hand'));
    }
  };
  hand(s.minute / 60, 5, 1);
  hand((s.hour % 12 + s.minute / 60) / 12, 3, 2);
  for (const look of looks) look.draw?.(g, cx, cy, s);
}

// ---- 페이지 ----

function render(scene, [w, h]) {
  const s = sceneContext(scene);
  const g = new Grid(Math.ceil(w / DOT), Math.ceil(h / DOT));
  const L = compose(g, g.cols, g.rows, s);
  return { s, g, L, canvas: g.canvas() };
}

// 위젯에 글자를 쓰지 않는다. 시각·날씨·이벤트는 그림으로 보이고, 같은 내용을 접근성 라벨로만 둔다.
function accessibilityLabel(s) {
  return [s.region, s.time, s.weather?.condition, ...s.occasions.map(id => OCCASIONS[id].name)].filter(Boolean).join(', ');
}

function widget(scene, sizeKey) {
  const [w, h] = SIZES[sizeKey];
  const { s, g, canvas } = render(scene, [w, h]);
  const offset = [Math.floor((g.cols * DOT - w) / 2), Math.floor((g.rows * DOT - h) / 2)];
  const box = document.createElement('div');
  box.className = `widget ${sizeKey}`;
  box.style.width = `${w}px`;
  box.style.height = `${h}px`;
  box.setAttribute('role', 'img');
  box.setAttribute('aria-label', accessibilityLabel(s));
  canvas.className = 'dots';
  Object.assign(canvas.style, { width: `${g.cols * DOT}px`, height: `${g.rows * DOT}px`, left: `${-offset[0]}px`, top: `${-offset[1]}px` });
  box.append(canvas);
  return { box, colors: new Set(g.cells.filter(Boolean)).size };
}

function crop(source, [x0, y0, x1, y1], cols, rows, scale) {
  [x0, y0, x1, y1] = [Math.max(0, x0), Math.max(0, y0), Math.min(cols, x1), Math.min(rows, y1)];
  const out = document.createElement('canvas');
  out.width = (x1 - x0) * scale;
  out.height = (y1 - y0) * scale;
  const ctx = out.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(source, x0, y0, x1 - x0, y1 - y0, 0, 0, out.width, out.height);
  return out;
}

// 구성 요소 × 이벤트 비교표. 이벤트마다 그 이벤트가 있는 장면을 medium 크기로 그려 구성 요소 자리만 잘라 보인다.
const MATRIX_ROWS = [
  ['기본', '초승달 밤'],
  ['설날', '설날 아침'],
  ['새해 첫날', '새해 첫 일출'],
  ['정월대보름', '정월대보름 밤'],
  ['부처님오신날', '부처님오신날 해 질 녘'],
  ['추석', '추석 보름달'],
  ['할로윈', '할로윈 밤'],
  ['크리스마스 이브', '크리스마스 이브 밤'],
  ['크리스마스', '눈 오는 크리스마스'],
];
const MATRIX_COLUMNS = [['window', '창문', 3], ['person', '사람', 3], ['cat', '고양이', 3], ['room', '방 안', 2], ['clock', '시계', 3]];

function matrix() {
  const grid = document.createElement('div');
  grid.className = 'matrix';
  grid.insertAdjacentHTML('beforeend', `<span></span>${MATRIX_COLUMNS.map(([, label]) => `<span class="head">${label}</span>`).join('')}`);
  for (const [label, title] of MATRIX_ROWS) {
    const { g, L, canvas } = render(SCENES.find(scene => scene.title === title), SIZES.medium);
    grid.insertAdjacentHTML('beforeend', `<span class="label">${label}</span>`);
    for (const [part, name, scale] of MATRIX_COLUMNS) {
      const cell = crop(canvas, L.boxes[part], g.cols, g.rows, scale);
      cell.dataset.component = part;
      cell.setAttribute('role', 'img');
      cell.setAttribute('aria-label', `${label} ${name}`);
      grid.append(cell);
    }
  }
  return grid;
}

document.getElementById('components').append(matrix());
document.getElementById('scenes').append(...SCENES.map(scene => {
  const widgets = Object.keys(SIZES).map(size => widget(scene, size));
  const weather = scene.weather ? `${scene.weather[0]} · 기온 ${scene.weather[3]}°` : '날씨 없음';
  const section = document.createElement('section');
  section.className = 'scene';
  section.innerHTML = `<h2>${scene.title}</h2><p class="meta">${scene.region} ${scene.date} ${scene.time} · 해 ${scene.sun[0]}° · ${weather} · 색 ${widgets.map(w => w.colors).join('/')}</p><div class="sizes"></div>`;
  section.querySelector('.sizes').append(...widgets.map(w => w.box));
  return section;
}));
</script>
