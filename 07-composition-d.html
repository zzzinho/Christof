<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구도 D 밖에서 본 창</title>
<link rel="stylesheet" href="design.css">
<style>
  header { padding: 32px 24px 8px; }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--page-muted); font-size: 0.875rem; }
  #scenes { display: grid; gap: 40px; padding: 24px 24px 64px; }
  .scene h2 { margin: 0 0 2px; font-size: 1rem; }
  .scene .meta { margin: 0 0 12px; color: var(--page-muted); font-size: 0.8125rem; }
  .sizes { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--page-gap); }
  .widget { background: var(--lofi-wood-dark); }
</style>
</head>
<body>
<header>
  <h1>구도 D 밖에서 본 창</h1>
  <p>눈 쌓인 집 밖에서 불 켜진 창 안을 본다. 사람과 고양이가 이쪽을 보고, 날씨는 집 둘레 하늘과 땅으로 보인다. 크리스마스 장면 둘로 구도만 바꿔 본다. 구성 요소 다섯과 크리스마스 모양(성에, 산타 모자, 빨간 목도리, 트리·선물, 호랑가시)은 07 비교안 모두 같다.</p>
</header>
<main id="scenes"></main>
<script src="assets/composition.js" data-composition="outside"></script>
</body>
</html>
